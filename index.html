<script>
/* ---- PWA: inline manifest + service worker (works from single file) ---- */
(function(){
  try{
    const manifest = {
      name:"Service Report", short_name:"Service Report", start_url:".", display:"standalone",
      background_color:"#0B1F3A", theme_color:"#0B1F3A",
      icons:[{ src:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#0B1F3A"/><path d="M195 150l30 30-95 95a21 21 0 01-30-30l95-95z" fill="#0E7C66"/><circle cx="330" cy="180" r="70" fill="none" stroke="#0E7C66" stroke-width="30"/></svg>'), sizes:"512x512", type:"image/svg+xml", purpose:"any" }]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link'); link.rel='manifest'; link.href=URL.createObjectURL(mBlob);
    document.head.appendChild(link);
    const meta = document.createElement('meta'); meta.name='theme-color'; meta.content='#0B1F3A'; document.head.appendChild(meta);
    const aMeta = document.createElement('meta'); aMeta.name='apple-mobile-web-app-capable'; aMeta.content='yes'; document.head.appendChild(aMeta);

    if('serviceWorker' in navigator){
      const swCode = `
        const CACHE='service-report-v1';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e=>{
          if(e.request.method!=='GET') return;
          e.respondWith(
            caches.open(CACHE).then(cache=>
              cache.match(e.request).then(hit=>{
                const net = fetch(e.request).then(res=>{ try{ cache.put(e.request, res.clone()); }catch(_){}; return res; }).catch(()=>hit);
                return hit || net;
              })
            )
          );
        });`;
      const swBlob = new Blob([swCode], {type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }
  }catch(e){}
})();

const DB_KEY = "kt_service_report_v1";
const loadDB = () => { try { return JSON.parse(localStorage.getItem(DB_KEY)) || null; } catch { return null; } };
const saveDB = (d) => { try { localStorage.setItem(DB_KEY, JSON.stringify(d)); } catch {} };

const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return ""; const d=new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; };
const fmtDateLong = (iso,lang) => { if(!iso) return ""; const d=new Date(iso);
  const mVi=["01","02","03","04","05","06","07","08","09","10","11","12"];
  const mEn=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return lang==='en' ? `${String(d.getDate()).padStart(2,'0')} ${mEn[d.getMonth()]} ${d.getFullYear()}` : `${String(d.getDate()).padStart(2,'0')}/${mVi[d.getMonth()]}/${d.getFullYear()}`;
};

const nextReportNo = (reports) => {
  const yr = new Date().getFullYear();
  const nums = reports.map(r=>{ const m=(r.info?.reportNo||"").match(new RegExp(`SR-${yr}-(\\d+)`)); return m?parseInt(m[1]):0; });
  const n = (nums.length?Math.max(...nums):0)+1;
  return `SR-${yr}-${String(n).padStart(4,'0')}`;
};

   ============================================================ */
async function geminiCall(apiKey, prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
  const res = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.4, maxOutputTokens:1024} })
  });
  if(!res.ok){ const e=await res.text(); throw new Error('Gemini '+res.status+': '+e.slice(0,120)); }
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
}

function Btn({children, onClick, variant='primary', size='md', className='', ...p}) {
  const base = "inline-flex items-center justify-center gap-2 font-semibold rounded-lg transition active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed";
  const sizes = {sm:"text-[13px] px-3 py-2", md:"text-[14px] px-4 py-2.5", lg:"text-[15px] px-5 py-3"};
  const variants = {
    primary:"bg-[var(--navy)] text-white hover:bg-[var(--navy-2)] card-shadow",
    accent:"bg-[var(--accent)] text-white hover:brightness-110 card-shadow",
    ghost:"bg-transparent text-[var(--ink-2)] hover:bg-[var(--ice)]",
    outline:"bg-white text-[var(--ink)] border border-[var(--line-strong)] hover:border-[var(--navy-3)] hover:bg-[var(--paper)]",
    danger:"bg-white text-[var(--red)] border border-[#F1C9C4] hover:bg-[var(--red-soft)]",
  };
  return <button onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...p}>{children}</button>;
}

function RichEditor({value, onChange, placeholder}) {
  const ref = useRef();
  useEffect(()=>{ if(ref.current && ref.current.innerHTML !== (value||"")) ref.current.innerHTML = value||""; },[]);

/* ---- Photo annotator (canvas overlay) ---- */
function PhotoAnnotator({photo, onSave, onClose}){
  const t = useT();
  const canvasRef = useRef();
  const imgRef = useRef();
  const [tool, setTool] = useState('arrow');
  const [color, setColor] = useState('#C0392B');
  const [shapes, setShapes] = useState(photo.shapes||[]);
  const [drawing, setDrawing] = useState(null);
  const [numCount, setNumCount] = useState((photo.shapes||[]).filter(s=>s.type==='number').length);
  const colors = ['#C0392B','#0E7C66','#1F6FB2','#C2790B','#0B1F3A','#FFFFFF'];

  const redraw = ()=>{
    const cv = canvasRef.current, img = imgRef.current;
    if(!cv||!img||!img.complete) return;
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0);
    const scale = img.naturalWidth/1000;
    const lw = Math.max(3, 5*scale);
    [...shapes, drawing].filter(Boolean).forEach((s,i)=>{
      ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = lw; ctx.lineCap='round';
      const x1=s.x1*cv.width, y1=s.y1*cv.height, x2=s.x2*cv.width, y2=s.y2*cv.height;
      if(s.type==='arrow'){
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        const ang=Math.atan2(y2-y1,x2-x1), h=18*scale;
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2-h*Math.cos(ang-Math.PI/6), y2-h*Math.sin(ang-Math.PI/6));
        ctx.lineTo(x2-h*Math.cos(ang+Math.PI/6), y2-h*Math.sin(ang+Math.PI/6));
        ctx.closePath(); ctx.fill();
      } else if(s.type==='rect'){
        ctx.strokeRect(x1,y1,x2-x1,y2-y1);
      } else if(s.type==='circle'){
        ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,2*Math.PI); ctx.stroke();
      } else if(s.type==='number'){
        const r=16*scale;
        ctx.beginPath(); ctx.arc(x1,y1,r,0,2*Math.PI); ctx.fill();
        ctx.fillStyle = s.color==='#FFFFFF'?'#0B1F3A':'#FFFFFF'; ctx.font=`bold ${20*scale}px 'Noto Sans',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(s.n), x1, y1);
      }
    });
  };
  useEffect(()=>{ redraw(); },[shapes, drawing]);

  const getPos = (e)=>{
    const cv = canvasRef.current, rect = cv.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    return { x: cx/rect.width, y: cy/rect.height };
  };
  const start = (e)=>{
    e.preventDefault(); const p=getPos(e);
    if(tool==='number'){
      const n=numCount+1; setNumCount(n);
      setShapes([...shapes,{type:'number',x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,n}]); return;
    }
    setDrawing({type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color});
  };
  const move = (e)=>{ if(!drawing) return; const p=getPos(e); setDrawing({...drawing,x2:p.x,y2:p.y}); };
  const end = ()=>{ if(drawing){ setShapes([...shapes,drawing]); setDrawing(null); } };

  const undo = ()=> setShapes(shapes.slice(0,-1));
  const clear = ()=>{ setShapes([]); setNumCount(0); };
  const save = ()=>{
    const cv = canvasRef.current;
    const dataURL = cv.toDataURL('image/jpeg',0.92);
    onSave({...photo, annotated:dataURL, shapes});
  };
  const tools = [{id:'arrow',k:'ann_arrow'},{id:'circle',k:'ann_circle'},{id:'rect',k:'ann_rect'},{id:'number',k:'ann_number'}];

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-3xl card-shadow-lg fade-in flex flex-col max-h-[92vh]" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-3 border-b border-[var(--line)]">
          <h3 className="font-bold text-[15px]">{t.annotate}</h3>
          <button onClick={onClose} className="p-1.5 rounded-md hover:bg-[var(--ice)]"><Icon d={I.x} s={18}/></button>
        </div>
        <div className="flex items-center gap-2 px-5 py-3 border-b border-[var(--line)] flex-wrap bg-[var(--paper)]">
          {tools.map(tl=>(
            <button key={tl.id} onClick={()=>setTool(tl.id)}
              className={"text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border transition "+
                (tool===tl.id?"bg-[var(--navy)] text-white border-[var(--navy)]":"bg-white border-[var(--line-strong)] text-[var(--ink-2)] hover:border-[var(--navy-3)]")}>{t[tl.k]}</button>
          ))}
          <div className="w-px h-6 bg-[var(--line-strong)] mx-1"></div>
          {colors.map(c=>(
            <button key={c} onClick={()=>setColor(c)}
              className={"w-6 h-6 rounded-full border-2 transition "+(color===c?"border-[var(--navy)] scale-110":"border-white")}
              style={{background:c, boxShadow:c==='#FFFFFF'?'inset 0 0 0 1px #CBD5E1':'none'}}/>
          ))}
          <div className="w-px h-6 bg-[var(--line-strong)] mx-1"></div>
          <button onClick={undo} className="text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border border-[var(--line-strong)] bg-white hover:border-[var(--navy-3)]">{t.ann_undo}</button>
          <button onClick={clear} className="text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border border-[#F1C9C4] text-[var(--red)] bg-white hover:bg-[var(--red-soft)]">{t.ann_clear}</button>
        </div>
        <div className="p-5 overflow-auto flex items-center justify-center bg-[#2D3748]">
          <img ref={imgRef} src={photo.src} onLoad={redraw} className="hidden"/>
          <canvas ref={canvasRef}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
            className="max-w-full max-h-[55vh] rounded-lg cursor-crosshair" style={{touchAction:'none'}}/>
        </div>
        <div className="flex justify-end gap-2 px-5 py-3 border-t border-[var(--line)]">
          <Btn variant="ghost" onClick={onClose}>{t.cancel}</Btn>
          <Btn variant="accent" onClick={save}><Icon d={I.check} s={16}/>{t.ann_done}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ---- Signature pad (draw on canvas) ---- */
function SignatureModal({sig, roleLabel, onSave, onClose}){
  const t = useT();
  const canvasRef = useRef();
  const [name, setName] = useState(sig.name||"");
  const [pos, setPos] = useState(sig.pos||"");
  const drawing = useRef(false);
  const last = useRef(null);

  useEffect(()=>{
    const cv = canvasRef.current;
    cv.width = cv.offsetWidth*2; cv.height = cv.offsetHeight*2;
    const ctx = cv.getContext('2d'); ctx.scale(2,2);
    ctx.strokeStyle='#0B1F3A'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    if(sig.img){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cv.offsetWidth,cv.offsetHeight); img.src=sig.img; }
  },[]);
  const pos_ = (e)=>{ const r=canvasRef.current.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:cx,y:cy}; };
  const start = (e)=>{ e.preventDefault(); drawing.current=true; last.current=pos_(e); };
  const move = (e)=>{ if(!drawing.current) return; e.preventDefault(); const ctx=canvasRef.current.getContext('2d'); const p=pos_(e);
    ctx.beginPath(); ctx.moveTo(last.current.x,last.current.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last.current=p; };
  const end = ()=>{ drawing.current=false; };
  const clear = ()=>{ const cv=canvasRef.current; cv.getContext('2d').clearRect(0,0,cv.width,cv.height); };
  const save = ()=>{ onSave({name, pos, img: canvasRef.current.toDataURL('image/png')}); };

  return (
    <div className="fixed inset-0 bg-black/45 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-md card-shadow-lg fade-in" onClick={e=>e.stopPropagation()}>

          <button onClick={onClose} className="p-1.5 rounded-md hover:bg-[var(--ice)]"><Icon d={I.x} s={18}/></button>
        </div>
        <div className="p-6 space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <Field label={t.sig_name} value={name} onChange={setName}/>
            <Field label={t.sig_pos} value={pos} onChange={setPos}/>
          </div>
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[12px] font-semibold text-[var(--ink-3)] uppercase tracking-wide">{t.sig_draw}</span>
              <button onClick={clear} className="text-[12px] font-semibold text-[var(--red)] hover:underline">{t.sig_clear}</button>
            </div>
            <canvas ref={canvasRef}
              onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
              onTouchStart={start} onTouchMove={move} onTouchEnd={end}
              className="w-full h-40 border-2 border-dashed border-[var(--line-strong)] rounded-lg bg-[var(--paper)] cursor-crosshair" style={{touchAction:'none'}}/>
          </div>
        </div>
        <div className="flex justify-end gap-2 px-6 py-4 border-t border-[var(--line)]">
          <Btn variant="ghost" onClick={onClose}>{t.cancel}</Btn>
          <Btn variant="accent" onClick={save}><Icon d={I.check} s={16}/>{t.save}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ---- QR code (renders to data url) ---- */
function useQR(text, size=120){
  const [url, setUrl] = useState(null);
  useEffect(()=>{
    if(!text || !window.QRCode) return;
    const holder = document.createElement('div');
    try{
      new window.QRCode(holder, {text, width:size, height:size, correctLevel: window.QRCode.CorrectLevel.M});
      setTimeout(()=>{ const img=holder.querySelector('img'), cv=holder.querySelector('canvas');
        if(img&&img.src) setUrl(img.src); else if(cv) setUrl(cv.toDataURL()); },60);
    }catch(e){}
  },[text,size]);
  return url;
}

function App(){
  const [db, setDB] = useState(initDB);
  const [lang, setLang] = useState(db.lang || 'vi');

  const setLangAndSave = (l)=>{ setLang(l); persist({...db, lang:l}); };

  const updateReport = useCallback((rid, patch)=>{
    setDB(prev=>{
      const reports = prev.reports.map(r=> r.id===rid ? {...r, ...(typeof patch==='function'?patch(r):patch)} : r);
      const next = {...prev, reports};
      saveDB(next); return next;
    });
  },[]);

  const createReport = (serviceType='inspection', fromDemo=false)=>{
    const rid = uid();
    const r = {
      id:rid, createdAt:Date.now(), status:'draft',
      info:{ reportNo: nextReportNo(db.reports), reportType:"reportType_service", date:todayISO(),
             engineer:"", customer:"", project:"", site:"", contact:"", position:"", phone:"", email:"" },
      equipment:[], serviceType, condition:'good',
      overview:{purpose:"",condition:"",env:""},
      work:[], checklistState:{}, measurements:[], findings:[],
      results:{result:"",assess:'normal',cause:""},

      execSummary:"", pdfLang:'vi',

    };
    persist({...db, reports:[r, ...db.reports]});

  const openReport = (rid)=>{ setActiveReport(rid); setView('builder'); };
  const deleteReport = (rid)=>{ persist({...db, reports:db.reports.filter(r=>r.id!==rid)}); };
  const duplicateReport = (rid)=>{

          {view==='builder' && report && <Builder report={report} update={(p)=>updateReport(report.id,p)} db={db} onExit={()=>setView('dashboard')} onPreview={()=>setView('preview')} onNeedKey={()=>setView('settings')}/>}

            {saved?t.autosaved:t.saving}

            className="text-[13px] font-semibold px-3 py-2 rounded-lg border border-[var(--line)] bg-white">
            {Object.keys(STATUS).map(s=><option key={s} value={s}>{t[STATUS[s].k]}</option>)}

              <span className="text-[13.5px] font-semibold leading-tight">{t[s.k]}</span>

        {/* editor */}
        <div className="flex-1 overflow-y-auto">
          <div className="max-w-[820px] mx-auto p-6 md:p-8 fade-in" key={section}>
            {section==='info' && <SectionInfo report={report} up={up} db={db}/>}

            {section==='work' && <SectionWork report={report} up={up}/>}

            {section==='photos' && <SectionPhotos report={report} up={up}/>}

            {/* nav footer */}
            <div className="flex items-center justify-between mt-8 pt-5 border-t border-[var(--line)] no-print">
              <Btn variant="outline" size="md" disabled={idx===0} onClick={()=>setSection(SECTIONS[idx-1].id)}>
                <Icon d={I.chevL} s={16}/>{t.back}
              </Btn>
              {idx<SECTIONS.length-1
                ? <Btn variant="primary" onClick={()=>setSection(SECTIONS[idx+1].id)}>{t[SECTIONS[idx+1].k]}<Icon d={I.chevR} s={16}/></Btn>

        </div>
      </div>
    </div>
  );
}

/* ---- Section: Work + Checklist ---- */
function SectionWork({report, up}){
  const t = useT();
  const work = report.work;
  const setW = (id,k,v)=> up({work: work.map(w=>w.id===id?{...w,[k]:v}:w)});
  const addW = ()=> up({work:[...work,{id:uid(),title:"",desc:"",status:'done',result:""}]});
  const delW = (id)=> up({work: work.filter(w=>w.id!==id)});
  const loadSample = ()=>{
    const sample = ["Visual Inspection","Power Supply Check","Sensor Inspection","Signal Verification","Measurement Test","Communication Test"];
    up({work:[...work, ...sample.map(s=>({id:uid(),title:s,desc:"",status:'done',result:""}))]});
  };

  // checklist based on first equipment
  const eqCl = report.equipment[0]?.checklist || 'generic';
  const cl = CHECKLISTS[eqCl] || CHECKLISTS.generic;
  const clState = report.checklistState || {};
  const toggle = (key)=> up({checklistState:{...clState,[key]:!clState[key]}});

  const WS = {done:{k:'ws_done',c:'#0E7C66'},pending:{k:'ws_pending',c:'#C2790B'},na:{k:'ws_na',c:'#8A94A3'}};

/* ---- Section: Photos ---- */
function SectionPhotos({report, up}){
  const t = useT();
  const photos = report.photos;
  const fileRef = useRef();
  const [drag, setDrag] = useState(false);
  const [annotating, setAnnotating] = useState(null);
  const saveAnn = (p)=> up({photos: photos.map(x=>x.id===p.id?p:x)});

  const addFiles = (files)=>{
    Array.from(files).forEach(file=>{
      if(!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e=> up(r=>({photos:[...r.photos,{id:uid(),src:e.target.result,caption:""}]}));
      reader.readAsDataURL(file);
    });
  };
  const onDrop = (e)=>{ e.preventDefault(); setDrag(false); if(e.dataTransfer.files) addFiles(e.dataTransfer.files); };
  const setCap = (id,v)=> up({photos: photos.map(p=>p.id===id?{...p,caption:v}:p)});
  const del = (id)=> up({photos: photos.filter(p=>p.id!==id)});
  const move = (id,dir)=>{
    const i = photos.findIndex(p=>p.id===id); const j=i+dir;
    if(j<0||j>=photos.length) return;
    const arr=[...photos]; [arr[i],arr[j]]=[arr[j],arr[i]]; up({photos:arr});
  };

  // paste support
  useEffect(()=>{
    const h = (e)=>{ if(e.clipboardData){ const items=[...e.clipboardData.items].filter(x=>x.type.startsWith('image/')); if(items.length){ addFiles(items.map(x=>x.getAsFile())); } } };
    window.addEventListener('paste',h); return ()=>window.removeEventListener('paste',h);
  },[photos]);

  return (
    <div className="space-y-5">
      <SecHead no="05" title={t.sec_photos}/>
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop}
        onClick={()=>fileRef.current.click()}
        className={"border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition bg-white "+(drag?"drag-over":"border-[var(--line-strong)] hover:border-[var(--accent)] hover:bg-[var(--paper)]")}>
        <div className="w-12 h-12 rounded-xl bg-[var(--ice)] text-[var(--navy)] flex items-center justify-center mx-auto mb-3"><Icon d={I.image} s={24}/></div>
        <div className="text-[14px] font-semibold text-[var(--ink-2)]">{t.dropHint}</div>
        <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={e=>addFiles(e.target.files)}/>
      </div>

      {photos.length===0 && <div className="text-[13px] text-[var(--ink-3)] py-2 text-center">{t.noPhoto}</div>}
      <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
        {photos.map((p,i)=>(
          <div key={p.id} className="bg-white rounded-xl border border-[var(--line)] card-shadow overflow-hidden group">
            <div className="relative aspect-video bg-[var(--paper)]">
              <img src={p.annotated||p.src} className="w-full h-full object-cover"/>
              <div className="absolute top-2 left-2 mono text-[11px] font-bold text-white bg-black/55 px-2 py-0.5 rounded">{t.figure} {String(i+1).padStart(2,'0')}</div>
              <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                <button onClick={()=>setAnnotating(p)} className="w-7 h-7 rounded-md bg-black/55 text-white flex items-center justify-center hover:bg-[var(--accent)]" title={t.annotate}><Icon d={I.edit} s={14}/></button>
                <button onClick={()=>move(p.id,-1)} className="w-7 h-7 rounded-md bg-black/55 text-white flex items-center justify-center hover:bg-black/75"><Icon d={I.chevL} s={15}/></button>
                <button onClick={()=>move(p.id,1)} className="w-7 h-7 rounded-md bg-black/55 text-white flex items-center justify-center hover:bg-black/75"><Icon d={I.chevR} s={15}/></button>
                <button onClick={()=>del(p.id)} className="w-7 h-7 rounded-md bg-black/55 text-white flex items-center justify-center hover:bg-[var(--red)]"><Icon d={I.trash} s={15}/></button>
              </div>
            </div>
            <input value={p.caption} onChange={e=>setCap(p.id,e.target.value)} placeholder={t.caption}
              className="w-full px-3 py-2.5 text-[13px] border-t border-[var(--line)] focus:border-[var(--accent)]"/>
          </div>
        ))}
      </div>
      {annotating && <PhotoAnnotator photo={annotating} onSave={(p)=>{saveAnn(p);setAnnotating(null);}} onClose={()=>setAnnotating(null)}/>}
    </div>
  );
}

/* ============================================================
   PREVIEW + PDF
   ============================================================ */
function PreviewScreen({report, settings, lang, onBack, update}){
  const t = useT();
  const [gen, setGen] = useState(false);
  const paperRef = useRef();
  const pdfLang = report.pdfLang || 'vi';
  const setPdfLang = (v)=> update && update({pdfLang:v});

  const exportPDF = async ()=>{
    setGen(true);
    await new Promise(r=>setTimeout(r,60));
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p','mm','a4');
      const pages = paperRef.current.querySelectorAll('.pdf-page');
      for(let i=0;i<pages.length;i++){
        const canvas = await html2canvas(pages[i], {scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false});
        const img = canvas.toDataURL('image/jpeg',0.92);
        if(i>0) pdf.addPage();
        pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST');
      }
      const fn = `${report.info.reportNo}_${(report.info.customer||'Report').replace(/[^\w]+/g,'-')}_${(report.equipment[0]?.model||'').replace(/[^\w]+/g,'-')}.pdf`.replace(/-+/g,'-');
      pdf.save(fn);
    } catch(err){ alert('PDF error: '+err.message); }
    setGen(false);
  };

  return (
    <div className="flex flex-col h-full bg-[#4A5568]">
      <div className="flex items-center justify-between px-6 py-3.5 bg-white border-b border-[var(--line)] no-print">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="p-2 rounded-lg hover:bg-[var(--ice)] text-[var(--ink-2)]"><Icon d={I.chevL} s={18}/></button>
          <div>
            <div className="font-bold text-[15px]">{t.previewTitle}</div>
            <div className="text-[12px] text-[var(--ink-3)] mono">{report.info.reportNo}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center gap-1 mr-1 text-[var(--ink-3)]"><Icon d={I.layers} s={16}/><span className="text-[12px] font-semibold hidden md:inline">{t.bilingual}</span></div>
          <div className="flex bg-[var(--paper)] rounded-lg p-0.5 border border-[var(--line)]">
            {[['vi',t.bi_vi],['en',t.bi_en],['both',t.bi_both]].map(([v,label])=>(
              <button key={v} onClick={()=>setPdfLang(v)}
                className={"text-[12.5px] font-semibold px-3 py-1.5 rounded-md transition "+(pdfLang===v?"bg-[var(--navy)] text-white":"text-[var(--ink-2)] hover:bg-white")}>{label}</button>
            ))}
          </div>
          <Btn variant="accent" onClick={exportPDF} disabled={gen}>
            {gen ? <><span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>{t.genPdf}</> : <><Icon d={I.download} s={17}/>{t.downloadPdf}</>}
          </Btn>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto py-8 px-4">
        <div ref={paperRef} className="mx-auto" style={{width:'210mm'}}>
          <ReportDocument report={report} settings={settings} lang={lang} pdfLang={pdfLang}/>
        </div>
      </div>
    </div>
  );
}

            <div style={{marginBottom:'8mm'}}>
              <H no="00">{L('execSummary')}</H>
              <p style={{fontSize:'9.5pt',lineHeight:1.6,color:'#3E4C61'}}>{report.execSummary}</p>
            </div>
          )}

          <H no="01">{L('reportInfo')}</H>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 12mm',marginBottom:'6mm'}}>
            <div>
              <KV k={L('f_customer')} v={report.info.customer}/>
              <KV k={L('f_project')} v={report.info.project}/>
              <KV k={L('f_site')} v={report.info.site}/>
              <KV k={L('f_contact')} v={report.info.contact}/>
            </div>
            <div>
              <KV k={L('f_engineer')} v={report.info.engineer}/>
              <KV k={L('f_date')} v={fmtDate(report.info.date)}/>
              <KV k={L('f_position')} v={report.info.position}/>
              <KV k={L('f_phone')} v={report.info.phone}/>
            </div>
          </div>

          {report.equipment.length>0 && (
            <div>
              <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'2mm'}}>{L('equipment')}</div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'9pt'}}>
                <thead><tr style={{background:'#F5F7FA'}}>
                  {[L('eq_name'),L('eq_mfr'),L('eq_model'),L('eq_serial'),L('eq_tag')].map((h,i)=>(
                    <th key={i} style={{textAlign:'left',padding:'2.5mm 3mm',fontSize:'7.5pt',color:'#6B7A90',textTransform:'uppercase',fontWeight:700,border:'1px solid #E2E8F0'}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {report.equipment.map(e=>(
                    <tr key={e.id}>
                      <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',fontWeight:600}}>{e.name}</td>
                      <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0'}}>{e.mfr}</td>
                      <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',fontFamily:"'JetBrains Mono',monospace"}}>{e.model}</td>
                      <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',fontFamily:"'JetBrains Mono',monospace"}}>{e.serial}</td>
                      <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',fontFamily:"'JetBrains Mono',monospace"}}>{e.tag}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
        <Footer n={2} total={TOTAL+1}/>
      </Page>

      {/* PAGE 2: Overview & Work */}
      <Page>
        <Header/>
        <div style={{padding:'8mm 16mm'}}>
          <H no="02">{L('sec_overview')}</H>
          {report.overview.purpose && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'1.5mm'}}>{L('ov_purpose')}</div>
            <p style={{fontSize:'9.5pt',lineHeight:1.6,color:'#3E4C61',marginBottom:'4mm'}}>{report.overview.purpose}</p>
          </>}
          {report.overview.condition && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'1.5mm'}}>{L('ov_condition')}</div>
            <div className="prose-report" style={{fontSize:'9.5pt',color:'#3E4C61',marginBottom:'4mm'}} dangerouslySetInnerHTML={{__html:report.overview.condition}}/>
          </>}
          {report.overview.env && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'1.5mm'}}>{L('ov_env')}</div>
            <div style={{fontSize:'9.5pt',lineHeight:1.6,color:'#3E4C61',marginBottom:'6mm',background:'#F5F7FA',padding:'3mm 4mm',borderRadius:'6px',borderLeft:'3px solid #0E7C66'}}>{report.overview.env}</div>
          </>}

          <H no="03">{L('sec_work')}</H>
          <div>
            {report.work.map((w,i)=>{
              const wc = w.status==='done'?'#0E7C66':w.status==='pending'?'#C2790B':'#8A94A3';
              return (
                <div key={w.id} style={{display:'flex',gap:'4mm',marginBottom:'3.5mm',paddingBottom:'3.5mm',borderBottom:i<report.work.length-1?'1px solid #EEF1F5':'none'}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'8.5pt',fontWeight:700,color:'#fff',background:'#0B1F3A',minWidth:'7mm',height:'7mm',borderRadius:'4px',display:'flex',alignItems:'center',justifyContent:'center'}}>{String(i+1).padStart(2,'0')}</div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'1mm'}}>
                      <span style={{fontSize:'10pt',fontWeight:700,color:'#0B1F3A'}}>{w.title}</span>
                      <span style={{fontSize:'7pt',fontWeight:700,color:wc,border:`1px solid ${wc}`,borderRadius:'3px',padding:'0 4px'}}>{both?`${DICT.vi[w.status==='done'?'ws_done':w.status==='pending'?'ws_pending':'ws_na']} / ${DICT.en[w.status==='done'?'ws_done':w.status==='pending'?'ws_pending':'ws_na']}`:(w.status==='done'?t.ws_done:w.status==='pending'?t.ws_pending:t.ws_na)}</span>
                    </div>
                    {w.result && <div style={{fontSize:'9pt',color:'#3E4C61',lineHeight:1.5}}>{w.result}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        <Footer n={3} total={TOTAL+1}/>
      </Page>

      {/* PAGE 3: Results + Measurements + Findings + Recommendation */}
      <Page>
        <Header/>
        <div style={{padding:'8mm 16mm'}}>
          <H no="04">{L('sec_results')}</H>
          <div style={{display:'inline-flex',alignItems:'center',gap:'8px',background:A.bg,padding:'2.5mm 5mm',borderRadius:'6px',marginBottom:'4mm'}}>
            <span style={{width:'10px',height:'10px',borderRadius:'50%',background:A.dot}}></span>
            <span style={{fontSize:'10pt',fontWeight:800,color:A.c}}>{assessLabel}</span>
          </div>
          {report.results.result && <p style={{fontSize:'9.5pt',lineHeight:1.6,color:'#3E4C61',marginBottom:'5mm'}}>{report.results.result}</p>}

          {report.measurements.length>0 && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'2mm'}}>{L('measurements')}</div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'9pt',marginBottom:'5mm'}}>
              <thead><tr style={{background:'#0B1F3A',color:'#fff'}}>
                {[L('m_param'),L('m_result'),L('m_unit'),L('m_status')].map((h,i)=>(
                  <th key={i} style={{textAlign:i===1?'right':'left',padding:'2.5mm 3mm',fontSize:'7.5pt',textTransform:'uppercase',fontWeight:700}}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {report.measurements.map((m,i)=>{ const ma=ASSESS[m.status]||ASSESS.normal; return (
                  <tr key={m.id} style={{background:i%2?'#F5F7FA':'#fff'}}>
                    <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',fontWeight:600}}>{m.param}</td>
                    <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',textAlign:'right',fontFamily:"'JetBrains Mono',monospace",fontWeight:700}}>{m.result}</td>
                    <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0',color:'#6B7A90'}}>{m.unit}</td>
                    <td style={{padding:'2.5mm 3mm',border:'1px solid #E2E8F0'}}><span style={{color:ma.c,fontWeight:600}}>● {both?`${DICT.vi[ma.k]} / ${DICT.en[ma.k]}`:t[ma.k]}</span></td>
                  </tr>
                );})}
              </tbody>
            </table>
          </>}

          {report.findings.length>0 && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'2mm'}}>{L('findings')}</div>
            {report.findings.map((f,i)=>(
              <div key={f.id} style={{border:'1px solid #E2E8F0',borderRadius:'8px',padding:'3.5mm 4mm',marginBottom:'3mm',borderLeft:`3px solid ${SEVc[f.severity]}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5mm'}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:'8pt',fontWeight:700,color:'#0B1F3A'}}>FINDING {String(i+1).padStart(2,'0')}</span>
                  <span style={{fontSize:'7.5pt',fontWeight:700,color:SEVc[f.severity]}}>{sevLabel(f.severity)}</span>
                </div>
                <div style={{fontSize:'9.5pt',fontWeight:700,color:'#0F1B2D',marginBottom:'1mm'}}>{f.finding}</div>
                {f.obs && <div style={{fontSize:'8.5pt',color:'#3E4C61',lineHeight:1.5,marginBottom:'1mm'}}><b style={{color:'#6B7A90'}}>{L('fi_obs')}:</b> {f.obs}</div>}
                {f.rec && <div style={{fontSize:'8.5pt',color:'#3E4C61',lineHeight:1.5}}><b style={{color:'#6B7A90'}}>{L('fi_rec')}:</b> {f.rec}</div>}
              </div>
            ))}
          </>}

          {report.results.cause && <>
            <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',marginBottom:'1.5mm',marginTop:'3mm'}}>{L('res_cause')}</div>
            <p style={{fontSize:'9.5pt',lineHeight:1.6,color:'#3E4C61',marginBottom:'5mm'}}>{report.results.cause}</p>
          </>}

          {/* recommendation card */}
          <div style={{border:'2px solid #0B1F3A',borderRadius:'10px',overflow:'hidden',marginTop:'2mm'}}>
            <div style={{background:'#0B1F3A',color:'#fff',padding:'3mm 5mm',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:'9.5pt',fontWeight:800,letterSpacing:'.5px'}}>{L('rec_title')}</span>
              <span style={{fontSize:'8pt',fontWeight:800,background:'#fff',color:priColor[report.recommendation.priority],padding:'1mm 3mm',borderRadius:'20px'}}>{L('rec_priority')}: {priLabel[report.recommendation.priority].toUpperCase()}</span>
            </div>
            <div style={{padding:'4mm 5mm',fontSize:'9.5pt',lineHeight:1.6,color:'#0F1B2D'}}>{report.recommendation.action||'—'}</div>
          </div>
        </div>
        <Footer n={4} total={TOTAL+1}/>
      </Page>

      {/* PAGE: Photos */}
      {report.photos.length>0 && (
        <Page>
          <Header/>
          <div style={{padding:'8mm 16mm'}}>
            <H no="05">{L('sec_photos')}</H>
            <div style={{display:'grid',gridTemplateColumns:report.photos.length===1?'1fr':'1fr 1fr',gap:'5mm'}}>
              {report.photos.map((p,i)=>(
                <div key={p.id} style={{gridColumn:report.photos.length===3&&i===0?'span 2':'auto'}}>
                  <div style={{border:'1px solid #E2E8F0',borderRadius:'8px',overflow:'hidden'}}>
                    <img src={p.annotated||p.src} style={{width:'100%',height:report.photos.length===1?'auto':'55mm',objectFit:'cover',display:'block'}}/>
                  </div>
                  <div style={{fontSize:'8pt',color:'#3E4C61',marginTop:'1.5mm',fontWeight:600}}>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",color:'#0B1F3A'}}>{t.figure} {String(i+1).padStart(2,'0')}</span>{p.caption?` — ${p.caption}`:''}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <Footer n={5} total={TOTAL+1}/>
        </Page>
      )}

      {/* END PAGE */}
      <Page>
        <div style={{height:'297mm',display:'flex',flexDirection:'column',justifyContent:'space-between',position:'relative'}}>
          <Header/>
          <div style={{textAlign:'center',padding:'0 20mm'}}>
            {/* signatures */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10mm',marginBottom:'30mm',textAlign:'center'}}>
              {[['sig_prepared','prepared'],['sig_checked','checked'],['sig_approved','approved']].map(([k,key])=>(
                <div key={key}>
                  <div style={{fontSize:'8pt',fontWeight:700,color:'#6B7A90',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'2mm'}}>{L(k)}</div>
                  <div style={{height:'18mm',display:'flex',alignItems:'flex-end',justifyContent:'center',marginBottom:'1mm'}}>
                    {report.signatures[key].img ? <img src={report.signatures[key].img} style={{maxHeight:'18mm',maxWidth:'90%',objectFit:'contain'}}/> : null}
                  </div>
                  <div style={{borderTop:'1px solid #CBD5E1',paddingTop:'2mm'}}>
                    <div style={{fontSize:'9.5pt',fontWeight:700,color:'#0B1F3A'}}>{report.signatures[key].name||'—'}</div>
                    <div style={{fontSize:'8pt',color:'#6B7A90'}}>{report.signatures[key].pos||''}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{fontSize:'16pt',fontWeight:800,color:'#0B1F3A',marginBottom:'2mm'}}>{both?`${DICT.vi.thankyou}`:t.thankyou}</div>
            <div style={{width:'40mm',height:'3px',background:'#0E7C66',margin:'4mm auto'}}></div>
            {qrUrl && (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',marginTop:'6mm'}}>
                <img src={qrUrl} style={{width:'26mm',height:'26mm'}}/>
                <div style={{fontSize:'7.5pt',color:'#6B7A90',marginTop:'2mm',fontFamily:"'JetBrains Mono',monospace"}}>{report.info.reportNo}{lastRev?` · REV ${String(lastRev.rev).padStart(2,'0')}`:''}</div>
              </div>
            )}
          </div>
          <div style={{background:'#0B1F3A',color:'#fff',padding:'8mm 16mm',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <div style={{fontWeight:800,fontSize:'11pt'}}>{settings.company}</div>
              <div style={{fontSize:'8pt',opacity:.7,marginTop:'1mm'}}>{settings.address}</div>
            </div>
            <div style={{textAlign:'right',fontSize:'8pt',opacity:.8}}>
              {settings.website && <div>{settings.website}</div>}
              {settings.email && <div>{settings.email}</div>}
              {settings.hotline && <div>{t.s_hotline}: {settings.hotline}</div>}
            </div>
          </div>
        </div>
      </Page>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
