<script>
/* ---- PWA: inline manifest + service worker (works from single file) ---- */
(function(){
  try{
    const manifest = {
      name:"Service Report — Kiên Thịnh", short_name:"Service Report", start_url:".", display:"standalone",
      background_color:"#1A2E24", theme_color:"#1A2E24",
      icons:[{ src:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="96" fill="#1A2E24"/><circle cx="256" cy="256" r="150" fill="none" stroke="#C99A2E" stroke-width="20"/><text x="256" y="320" font-family="Georgia,serif" font-size="200" font-weight="700" fill="#C99A2E" text-anchor="middle">KT</text><path d="M150 330 Q256 380 362 330" stroke="#0B7A47" stroke-width="22" fill="none" stroke-linecap="round"/></svg>'), sizes:"512x512", type:"image/svg+xml", purpose:"any" }]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link'); link.rel='manifest'; link.href=URL.createObjectURL(mBlob);
    document.head.appendChild(link);
    const meta = document.createElement('meta'); meta.name='theme-color'; meta.content='#1A2E24'; document.head.appendChild(meta);
    const aMeta = document.createElement('meta'); aMeta.name='apple-mobile-web-app-capable'; aMeta.content='yes'; document.head.appendChild(aMeta);

    if('serviceWorker' in navigator){
      const swCode = `
        const CACHE='service-report-v1';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', e=>{
          if(e.request.method!=='GET') return;
          e.respondWith(
            caches.open(CACHE).then(cache=>
              cache.match(e.request).then(hit=>{
                const net = fetch(e.request).then(res=>{ try{ cache.put(e.request, res.clone()); }catch(_){}; return res; }).catch(()=>hit);
                return hit || net;
              })
            )
          );
        });`;
      const swBlob = new Blob([swCode], {type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }
  }catch(e){}
})();

  :root{
    /* Brand palette derived from Kiên Thịnh logo — Gold & Green */
    --gold:#B8860B; --gold-2:#CD9B38; --gold-3:#A5760A; --gold-bright:#D9B85C;
    --gold-soft:#FBF3DF; --gold-line:#EAD9A8;
    --green:#0B7A47; --green-2:#0E8A50; --green-3:#095C36; --green-soft:#E3F3EA;
    /* "navy" name kept for compatibility — now a deep charcoal-green that pairs with gold */
    --navy:#1A2E24; --navy-2:#23402F; --navy-3:#2E5140;
    --steel:#6E7F73; --ice:#F0F1EC; --paper:#F7F6F1;
    --line:#E6E3D8; --line-strong:#D3CFBE;
    --accent:#0B7A47; --accent-soft:#E3F3EA;
    --amber:#B8860B; --amber-soft:#FBF3DF;
    --red:#B23A2E; --red-soft:#FbE9E7;
    --blue:#1F6FB2; --blue-soft:#E5F0F9;
    --ink:#22271F; --ink-2:#4A4E43; --ink-3:#7A7D70;
    /* PDF-specific brand tokens */
    --pdf-ink:#1E2A22;
  }
  *{-webkit-font-smoothing:antialiased;}
  body{font-family:'Noto Sans',Arial,sans-serif;background:var(--paper);color:var(--ink);margin:0;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .serif{font-family:'Noto Serif',Georgia,serif;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#cfcabb;border-radius:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .fade-in{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .slide-in{animation:slide .3s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes slide{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
  .spin{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  [contenteditable]:focus{outline:none;}
  .card-shadow{box-shadow:0 1px 2px rgba(34,39,31,.04),0 1px 3px rgba(34,39,31,.06);}
  .card-shadow-lg{box-shadow:0 6px 24px rgba(34,39,31,.09),0 1px 3px rgba(34,39,31,.06);}
  .gold-text{background:linear-gradient(135deg,#A5760A 0%,#D9B85C 45%,#B8860B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .no-print{}
  @media print{.no-print{display:none!important;}}
  .prose-report h3{font-size:11pt;font-weight:700;margin:14px 0 6px;color:var(--pdf-ink);}
  .prose-report p{margin:5px 0;line-height:1.55;}
  .prose-report ul{margin:5px 0;padding-left:18px;list-style:disc;}
  .prose-report ol{margin:5px 0;padding-left:18px;list-style:decimal;}
  .drag-over{border-color:var(--gold)!important;background:var(--gold-soft)!important;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;}
  .tab-btn{transition:all .15s;}
  /* Serif for report-facing headings in the app */
  .app-title{font-family:'Noto Serif',Georgia,serif;}
</style>

const nextReportNo = (reports) => {
  const yr = new Date().getFullYear();
  const nums = reports.map(r=>{ const m=(r.info?.reportNo||"").match(new RegExp(`SR-${yr}-(\\d+)`)); return m?parseInt(m[1]):0; });
  const n = (nums.length?Math.max(...nums):0)+1;
  return `SR-${yr}-${String(n).padStart(4,'0')}`;
};

/* ============================================================
   IMAGE — compress & resize (keeps technical detail, shrinks PDF)
   ============================================================ */
const MAX_IMG_DIM = 1600;        // px, đủ nét cho chi tiết thiết bị
const IMG_QUALITY = 0.82;        // JPEG quality
const MAX_FILE_MB = 25;          // từ chối file quá lớn trước khi đọc
function compressImage(file){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type.startsWith('image/')) return reject(new Error('invalid'));
    if(file.size > MAX_FILE_MB*1024*1024) return reject(new Error('toolarge'));
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode'));
      img.onload = ()=>{
        let {width:w, height:h} = img;
        if(w>MAX_IMG_DIM || h>MAX_IMG_DIM){
          const s = MAX_IMG_DIM/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s);
        }
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        const hasAlpha = file.type==='image/png';
        const out = cv.toDataURL('image/jpeg', IMG_QUALITY);
        resolve({ src:out, w, h });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function geminiCall(apiKey, prompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
  const res = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.4, maxOutputTokens:1024} })
  });
  if(!res.ok){ const e=await res.text(); throw new Error('Gemini '+res.status+': '+e.slice(0,120)); }
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
}

function Btn({children, onClick, variant='primary', size='md', className='', ...p}) {
  const base = "inline-flex items-center justify-center gap-2 font-semibold rounded-lg transition active:scale-[.98] disabled:opacity-50 disabled:cursor-not-allowed";
  const sizes = {sm:"text-[13px] px-3 py-2", md:"text-[14px] px-4 py-2.5", lg:"text-[15px] px-5 py-3"};
  const variants = {
    primary:"bg-[var(--navy)] text-white hover:bg-[var(--navy-2)] card-shadow",
    accent:"bg-[var(--accent)] text-white hover:brightness-110 card-shadow",
    gold:"text-white card-shadow hover:brightness-105",
    ghost:"bg-transparent text-[var(--ink-2)] hover:bg-[var(--ice)]",
    outline:"bg-white text-[var(--ink)] border border-[var(--line-strong)] hover:border-[var(--gold)] hover:bg-[var(--gold-soft)]",
    danger:"bg-white text-[var(--red)] border border-[#E4C4BF] hover:bg-[var(--red-soft)]",
  };
  const style = variant==='gold' ? {background:'linear-gradient(135deg,#A5760A,#C99A2E)'} : undefined;
  return <button onClick={onClick} style={style} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...p}>{children}</button>;
}

/* Rich text editor (contentEditable, simple toolbar) */
function RichEditor({value, onChange, placeholder, minH=90}) {
  const ref = useRef();
  const [showColor, setShowColor] = useState(false);
  useEffect(()=>{ if(ref.current && ref.current.innerHTML !== (value||"")) ref.current.innerHTML = value||""; },[]);
  const cmd = (c,v=null)=>{ document.execCommand(c,false,v); ref.current.focus(); onChange(ref.current.innerHTML); };
  const colors = [
    {name:'Mặc định', v:'#22271F'},
    {name:'Xanh lá', v:'#0B7A47'},
    {name:'Vàng kim', v:'#A5760A'},
    {name:'Đỏ', v:'#B23A2E'},
    {name:'Xanh dương', v:'#1F6FB2'},
  ];
  const tools = [
    {c:'bold',label:'B',style:'font-bold'},
    {c:'italic',label:'I',style:'italic'},
    {c:'underline',label:'U',style:'underline'},
    {c:'insertUnorderedList',label:'• List'},
    {c:'insertOrderedList',label:'1. List'},
  ];
  return (
    <div className="col-span-2 border border-[var(--line)] rounded-lg overflow-hidden bg-white focus-within:border-[var(--gold)] transition">
      <div className="flex items-center gap-1 px-2 py-1.5 border-b border-[var(--line)] bg-[var(--paper)] relative flex-wrap">
        {tools.map(t=>(
          <button key={t.c} onMouseDown={e=>{e.preventDefault();cmd(t.c);}}
            className={"px-2.5 py-1 text-[13px] rounded hover:bg-[var(--ice)] text-[var(--ink-2)] "+(t.style||"")}>{t.label}</button>
        ))}
        <div className="w-px h-5 bg-[var(--line-strong)] mx-0.5"></div>
        <div className="relative">
          <button onMouseDown={e=>{e.preventDefault();setShowColor(s=>!s);}}
            className="px-2 py-1 text-[13px] rounded hover:bg-[var(--ice)] text-[var(--ink-2)] flex items-center gap-1" title="Màu chữ">
            <span style={{width:'14px',height:'14px',borderRadius:'3px',background:'linear-gradient(135deg,#0B7A47,#A5760A,#B23A2E)',display:'inline-block'}}></span>A
          </button>
          {showColor && (
            <div className="absolute top-full left-0 mt-1 bg-white border border-[var(--line)] rounded-lg card-shadow-lg p-1.5 z-20 flex gap-1">
              {colors.map(c=>(
                <button key={c.v} onMouseDown={e=>{e.preventDefault();cmd('foreColor',c.v);setShowColor(false);}} title={c.name}
                  className="w-6 h-6 rounded-md border border-[var(--line)] hover:scale-110 transition" style={{background:c.v}}></button>
              ))}
            </div>
          )}
        </div>
      </div>
      <div ref={ref} contentEditable onInput={e=>onChange(e.currentTarget.innerHTML)}
        onBlur={()=>setShowColor(false)}
        data-ph={placeholder}
        style={{minHeight:minH+'px'}}
        className="px-3 py-2.5 text-[14px] leading-relaxed text-[var(--ink)] prose-report empty:before:content-[attr(data-ph)] empty:before:text-[var(--ink-3)]"
        suppressContentEditableWarning></div>
    </div>
  );
}

/* ---- Reusable professional image uploader (drag-drop zone + thumbnail grid) ---- */
function ImageUploader({photos=[], onChange, label, compact}){
  const t = useT();
  const fileRef = useRef();
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [lightbox, setLightbox] = useState(null);
  const dragIdx = useRef(null);

  const addFiles = async (files)=>{
    const arr = Array.from(files).filter(f=>f.type.startsWith('image/'));
    if(!arr.length){ setErr(t.photo_err_type); setTimeout(()=>setErr(""),3000); return; }
    setBusy(true); setErr("");
    const added = [];
    for(const f of arr){
      try{ const r = await compressImage(f); added.push({id:uid(), src:r.src, w:r.w, h:r.h, caption:""}); }
      catch(e){ setErr(e.message==='toolarge'?t.photo_err_size:t.photo_err_type); }
    }
    if(added.length) onChange([...(photos||[]), ...added]);
    setBusy(false);
    if(err) setTimeout(()=>setErr(""),3000);
  };
  const onDrop = (e)=>{ e.preventDefault(); setDrag(false); if(e.dataTransfer.files) addFiles(e.dataTransfer.files); };
  const del = (id)=> onChange(photos.filter(p=>p.id!==id));
  const setCap = (id,v)=> onChange(photos.map(p=>p.id===id?{...p,caption:v}:p));
  const reorder = (from,to)=>{ if(from===to||from==null||to==null) return; const arr=[...photos]; const [m]=arr.splice(from,1); arr.splice(to,0,m); onChange(arr); };

  return (
    <div>
      {label && <div className="text-[12px] font-semibold text-[var(--ink-3)] uppercase tracking-wide mb-2">{label} {photos.length>0 && <span className="text-[var(--gold-3)] font-bold">· {photos.length} {t.photo_count}</span>}</div>}
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop}
        onClick={()=>fileRef.current.click()}
        className={"border-2 border-dashed rounded-xl text-center cursor-pointer transition bg-white "+
          (compact?"p-5":"p-8 ")+(drag?"drag-over":"border-[var(--line-strong)] hover:border-[var(--gold)] hover:bg-[var(--gold-soft)]")}>
        {busy ? (
          <div className="flex items-center justify-center gap-2 text-[var(--ink-2)] text-[14px] font-semibold py-2">
            <span className="w-5 h-5 border-2 border-[var(--gold)]/30 border-t-[var(--gold)] rounded-full spin"></span>{t.photo_processing}
          </div>
        ) : (
          <>
            <div className={"rounded-xl bg-[var(--gold-soft)] text-[var(--gold-3)] flex items-center justify-center mx-auto mb-2.5 "+(compact?"w-9 h-9":"w-12 h-12")}><Icon d={I.image} s={compact?18:24}/></div>
            <div className="text-[13.5px] font-semibold text-[var(--ink-2)]">{t.photo_drop}</div>
            <div className="text-[11.5px] text-[var(--ink-3)] mt-1 tracking-wide">{t.photo_formats}</div>
          </>
        )}
        <input ref={fileRef} type="file" accept="image/jpeg,image/jpg,image/png,image/webp" multiple className="hidden" onChange={e=>{addFiles(e.target.files); e.target.value='';}}/>
      </div>
      {err && <div className="text-[12.5px] text-[var(--red)] bg-[var(--red-soft)] px-3 py-2 rounded-lg mt-2">{err}</div>}

      {photos.length>0 && (
        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3">
          {photos.map((p,i)=>(
            <div key={p.id} draggable
              onDragStart={()=>dragIdx.current=i}
              onDragOver={e=>e.preventDefault()}
              onDrop={()=>{reorder(dragIdx.current,i);dragIdx.current=null;}}
              className="group bg-white rounded-xl border border-[var(--line)] card-shadow overflow-hidden">
              <div className="relative aspect-[4/3] bg-[var(--paper)] cursor-move">
                <img src={p.src} className="w-full h-full object-cover"/>
                <div className="absolute top-1.5 left-1.5 mono text-[10.5px] font-bold text-white px-1.5 py-0.5 rounded" style={{background:'rgba(30,42,34,.72)'}}>{String(i+1).padStart(2,'0')}</div>
                <div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition"></div>
                <div className="absolute top-1.5 right-1.5 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                  <button onClick={(e)=>{e.stopPropagation();setLightbox(p);}} className="w-7 h-7 rounded-md text-white flex items-center justify-center hover:brightness-110" style={{background:'rgba(30,42,34,.72)'}} title={t.view_large}><Icon d={I.eye} s={14}/></button>
                  <button onClick={(e)=>{e.stopPropagation();del(p.id);}} className="w-7 h-7 rounded-md text-white flex items-center justify-center hover:bg-[var(--red)]" style={{background:'rgba(30,42,34,.72)'}}><Icon d={I.trash} s={14}/></button>
                </div>
              </div>
              <input value={p.caption||""} onChange={e=>setCap(p.id,e.target.value)} placeholder={t.photo_caption_ph}
                className="w-full px-2.5 py-2 text-[12.5px] border-t border-[var(--line)] focus:border-[var(--gold)]"/>
            </div>
          ))}
        </div>
      )}
      {lightbox && <Lightbox src={lightbox.src} caption={lightbox.caption} onClose={()=>setLightbox(null)}/>}
    </div>
  );
}

/* ---- Photo annotator (canvas overlay) ---- */
function PhotoAnnotator({photo, onSave, onClose}){
  const t = useT();
  const canvasRef = useRef();
  const imgRef = useRef();
  const [tool, setTool] = useState('arrow');
  const [color, setColor] = useState('#C0392B');
  const [shapes, setShapes] = useState(photo.shapes||[]);
  const [drawing, setDrawing] = useState(null);
  const [numCount, setNumCount] = useState((photo.shapes||[]).filter(s=>s.type==='number').length);
  const colors = ['#C0392B','#0E7C66','#1F6FB2','#C2790B','#0B1F3A','#FFFFFF'];

  const redraw = ()=>{
    const cv = canvasRef.current, img = imgRef.current;
    if(!cv||!img||!img.complete) return;
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0);
    const scale = img.naturalWidth/1000;
    const lw = Math.max(3, 5*scale);
    [...shapes, drawing].filter(Boolean).forEach((s,i)=>{
      ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = lw; ctx.lineCap='round';
      const x1=s.x1*cv.width, y1=s.y1*cv.height, x2=s.x2*cv.width, y2=s.y2*cv.height;
      if(s.type==='arrow'){
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        const ang=Math.atan2(y2-y1,x2-x1), h=18*scale;
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2-h*Math.cos(ang-Math.PI/6), y2-h*Math.sin(ang-Math.PI/6));
        ctx.lineTo(x2-h*Math.cos(ang+Math.PI/6), y2-h*Math.sin(ang+Math.PI/6));
        ctx.closePath(); ctx.fill();
      } else if(s.type==='rect'){
        ctx.strokeRect(x1,y1,x2-x1,y2-y1);
      } else if(s.type==='circle'){
        ctx.beginPath(); ctx.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,2*Math.PI); ctx.stroke();
      } else if(s.type==='number'){
        const r=16*scale;
        ctx.beginPath(); ctx.arc(x1,y1,r,0,2*Math.PI); ctx.fill();
        ctx.fillStyle = s.color==='#FFFFFF'?'#0B1F3A':'#FFFFFF'; ctx.font=`bold ${20*scale}px 'Noto Sans',Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(s.n), x1, y1);
      }
    });
  };
  useEffect(()=>{ redraw(); },[shapes, drawing]);

  const getPos = (e)=>{
    const cv = canvasRef.current, rect = cv.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    return { x: cx/rect.width, y: cy/rect.height };
  };
  const start = (e)=>{
    e.preventDefault(); const p=getPos(e);
    if(tool==='number'){
      const n=numCount+1; setNumCount(n);
      setShapes([...shapes,{type:'number',x1:p.x,y1:p.y,x2:p.x,y2:p.y,color,n}]); return;
    }
    setDrawing({type:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,color});
  };
  const move = (e)=>{ if(!drawing) return; const p=getPos(e); setDrawing({...drawing,x2:p.x,y2:p.y}); };
  const end = ()=>{ if(drawing){ setShapes([...shapes,drawing]); setDrawing(null); } };

  const undo = ()=> setShapes(shapes.slice(0,-1));
  const clear = ()=>{ setShapes([]); setNumCount(0); };
  const save = ()=>{
    const cv = canvasRef.current;
    const dataURL = cv.toDataURL('image/jpeg',0.92);
    onSave({...photo, annotated:dataURL, shapes});
  };
  const tools = [{id:'arrow',k:'ann_arrow'},{id:'circle',k:'ann_circle'},{id:'rect',k:'ann_rect'},{id:'number',k:'ann_number'}];

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-3xl card-shadow-lg fade-in flex flex-col max-h-[92vh]" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-3 border-b border-[var(--line)]">
          <h3 className="font-bold text-[15px]">{t.annotate}</h3>
          <button onClick={onClose} className="p-1.5 rounded-md hover:bg-[var(--ice)]"><Icon d={I.x} s={18}/></button>
        </div>
        <div className="flex items-center gap-2 px-5 py-3 border-b border-[var(--line)] flex-wrap bg-[var(--paper)]">
          {tools.map(tl=>(
            <button key={tl.id} onClick={()=>setTool(tl.id)}
              className={"text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border transition "+
                (tool===tl.id?"bg-[var(--navy)] text-white border-[var(--navy)]":"bg-white border-[var(--line-strong)] text-[var(--ink-2)] hover:border-[var(--navy-3)]")}>{t[tl.k]}</button>
          ))}
          <div className="w-px h-6 bg-[var(--line-strong)] mx-1"></div>
          {colors.map(c=>(
            <button key={c} onClick={()=>setColor(c)}
              className={"w-6 h-6 rounded-full border-2 transition "+(color===c?"border-[var(--navy)] scale-110":"border-white")}
              style={{background:c, boxShadow:c==='#FFFFFF'?'inset 0 0 0 1px #CBD5E1':'none'}}/>
          ))}
          <div className="w-px h-6 bg-[var(--line-strong)] mx-1"></div>
          <button onClick={undo} className="text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border border-[var(--line-strong)] bg-white hover:border-[var(--navy-3)]">{t.ann_undo}</button>
          <button onClick={clear} className="text-[12.5px] font-semibold px-3 py-1.5 rounded-lg border border-[#F1C9C4] text-[var(--red)] bg-white hover:bg-[var(--red-soft)]">{t.ann_clear}</button>
        </div>
        <div className="p-5 overflow-auto flex items-center justify-center bg-[#2D3748]">
          <img ref={imgRef} src={photo.src} onLoad={redraw} className="hidden"/>
          <canvas ref={canvasRef}
            onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
            onTouchStart={start} onTouchMove={move} onTouchEnd={end}
            className="max-w-full max-h-[55vh] rounded-lg cursor-crosshair" style={{touchAction:'none'}}/>
        </div>
        <div className="flex justify-end gap-2 px-5 py-3 border-t border-[var(--line)]">
          <Btn variant="ghost" onClick={onClose}>{t.cancel}</Btn>
          <Btn variant="accent" onClick={save}><Icon d={I.check} s={16}/>{t.ann_done}</Btn>
        </div>
      </div>
    </div>
  );
}

function SignatureModal({sig, roleLabel, onSave, onClose}){
  const t = useT();
  const canvasRef = useRef();
  const [name, setName] = useState(sig.name||"");
  const [pos, setPos] = useState(sig.pos||"");
  const drawing = useRef(false);
  const last = useRef(null);

  useEffect(()=>{
    const cv = canvasRef.current;
    cv.width = cv.offsetWidth*2; cv.height = cv.offsetHeight*2;
    const ctx = cv.getContext('2d'); ctx.scale(2,2);
    ctx.strokeStyle='#0B1F3A'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
    if(sig.img){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cv.offsetWidth,cv.offsetHeight); img.src=sig.img; }
  },[]);
  const pos_ = (e)=>{ const r=canvasRef.current.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:cx,y:cy}; };
  const start = (e)=>{ e.preventDefault(); drawing.current=true; last.current=pos_(e); };
  const move = (e)=>{ if(!drawing.current) return; e.preventDefault(); const ctx=canvasRef.current.getContext('2d'); const p=pos_(e);
    ctx.beginPath(); ctx.moveTo(last.current.x,last.current.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last.current=p; };
  const end = ()=>{ drawing.current=false; };
  const clear = ()=>{ const cv=canvasRef.current; cv.getContext('2d').clearRect(0,0,cv.width,cv.height); };
  const save = ()=>{ onSave({name, pos, img: canvasRef.current.toDataURL('image/png')}); };

  return (
    <div className="fixed inset-0 bg-black/45 flex items-center justify-center z-[60] p-4" onClick={onClose}>

              <button onClick={clear} className="text-[12px] font-semibold text-[var(--red)] hover:underline">{t.sig_clear}</button>
            </div>
            <canvas ref={canvasRef}

/* ---- QR code (renders to data url) ---- */
function useQR(text, size=120){
  const [url, setUrl] = useState(null);
  useEffect(()=>{
    if(!text || !window.QRCode) return;
    const holder = document.createElement('div');
    try{
      new window.QRCode(holder, {text, width:size, height:size, correctLevel: window.QRCode.CorrectLevel.M});
      setTimeout(()=>{ const img=holder.querySelector('img'), cv=holder.querySelector('canvas');
        if(img&&img.src) setUrl(img.src); else if(cv) setUrl(cv.toDataURL()); },60);
    }catch(e){}
  },[text,size]);
  return url;
}

    const rid = uid();
    const r = {
      id:rid, createdAt:Date.now(), status:'draft',
      info:{ reportNo: nextReportNo(db.reports), reportType:"reportType_service", date:todayISO(),
             engineer:"", customer:"", project:"", site:"", contact:"", position:"", phone:"", email:"" },
      equipment:[], serviceType, condition:'good',
      overview:{purpose:"",condition:"",env:"",photos:[]},
      workPhotos:[],
      work:[], checklistState:{}, measurements:[], findings:[],
      results:{result:"",assess:'normal',cause:"",photos:[]},
      conclusion:"",
      recommendation:{action:"",priority:'med'},
      photos:[],
      signatures:{prepared:{name:"",pos:"",img:null},checked:{name:"",pos:"",img:null},approved:{name:"",pos:"",img:null}},
      execSummary:"", pdfLang:'vi',
      revisions:[{rev:0, date:todayISO(), by:"", desc:"Bản phát hành đầu tiên"}],
    };
    persist({...db, reports:[r, ...db.reports]});
    setActiveReport(rid); setView('builder');
  };

  const openReport = (rid)=>{ setActiveReport(rid); setView('builder'); };
  const deleteReport = (rid)=>{ persist({...db, reports:db.reports.filter(r=>r.id!==rid)}); };
  const duplicateReport = (rid)=>{
    const src = db.reports.find(r=>r.id===rid); if(!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid(); copy.createdAt = Date.now(); copy.status='draft';
    copy.info.reportNo = nextReportNo(db.reports);
    persist({...db, reports:[copy, ...db.reports]});
  };

  const report = db.reports.find(r=>r.id===activeReport);

  return (
    <LangCtx.Provider value={t}>
      <div className="flex h-screen overflow-hidden text-[var(--ink)]">
        <Sidebar view={view} setView={(v)=>{setView(v);}} settings={db.settings} lang={lang} setLang={setLangAndSave}/>
        <main className="flex-1 overflow-y-auto bg-[var(--paper)]">
          {view==='dashboard' && <Dashboard db={db} onNew={createReport} onOpen={openReport} setView={setView}/>}
          {view==='reports' && <ReportsList db={db} onOpen={openReport} onNew={createReport} onDelete={deleteReport} onDup={duplicateReport} title={t.nav_reports}/>}
          {view==='history' && <ReportsList db={db} onOpen={openReport} onNew={createReport} onDelete={deleteReport} onDup={duplicateReport} title={t.history_title} sub={t.history_sub}/>}
          {view==='customers' && <Customers db={db} persist={persist}/>}
          {view==='equipment' && <EquipmentLib db={db} persist={persist}/>}
          {view==='templates' && <Templates onCreate={createReport}/>}
          {view==='settings' && <Settings db={db} persist={persist}/>}
          {view==='builder' && report && <Builder report={report} update={(p)=>updateReport(report.id,p)} db={db} persist={persist} onExit={()=>setView('dashboard')} onPreview={()=>setView('preview')} onNeedKey={()=>setView('settings')}/>}
          {view==='preview' && report && <PreviewScreen report={report} settings={db.settings} lang={lang} onBack={()=>setView('builder')} update={(p)=>updateReport(report.id,p)}/>}
        </main>
      </div>
    </LangCtx.Provider>
  );
}

/* ============================================================

   ============================================================ */
function Sidebar({view, setView, settings, lang, setLang}){
  const t = useT();
  const [deferred, setDeferred] = useState(null);
  const [installed, setInstalled] = useState(false);
  useEffect(()=>{
    const h = (e)=>{ e.preventDefault(); setDeferred(e); };
    window.addEventListener('beforeinstallprompt', h);
    window.addEventListener('appinstalled', ()=>{ setInstalled(true); setDeferred(null); });
    return ()=>window.removeEventListener('beforeinstallprompt', h);
  },[]);
  const install = async ()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; setDeferred(null); };
  const items = [
    {id:'dashboard', k:'nav_dashboard', icon:I.dash},
    {id:'reports', k:'nav_reports', icon:I.reports},
    {id:'customers', k:'nav_customers', icon:I.customers},
    {id:'equipment', k:'nav_equipment', icon:I.equipment},
    {id:'templates', k:'nav_templates', icon:I.templates},
    {id:'history', k:'nav_history', icon:I.history},
    {id:'settings', k:'nav_settings', icon:I.settings},
  ];
  const isActive = (id)=> view===id || (view==='builder'&&id==='reports') || (view==='preview'&&id==='reports');
  return (
    <aside className="w-[248px] shrink-0 bg-[var(--navy)] text-white flex flex-col no-print" style={{background:'linear-gradient(180deg,#1A2E24 0%,#16261E 100%)'}}>
      <div className="px-5 pt-6 pb-5 border-b border-white/8">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl bg-white flex items-center justify-center overflow-hidden shrink-0">
            <img src={settings.logo||LOGO_MARK} className="w-9 h-9 object-contain"/>
          </div>
          <div>
            <div className="app-title font-bold text-[15.5px] tracking-tight leading-none">Service Report</div>
            <div className="text-[11px] mt-1" style={{color:'var(--gold-bright)'}}>{settings.brand}</div>
          </div>
        </div>
      </div>
      <nav className="flex-1 px-3 pt-3 space-y-0.5">
        {items.map(it=>{
          const on = isActive(it.id);
          return (
            <button key={it.id} onClick={()=>setView(it.id)}
              className={"relative w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-[14px] font-medium transition "+
                (on ? "text-white" : "text-white/55 hover:text-white hover:bg-white/5")}
              style={on?{background:'rgba(184,134,11,.14)'}:{}}>
              {on && <span className="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-6 rounded-r" style={{background:'linear-gradient(180deg,#D9B85C,#B8860B)'}}></span>}
              <span style={on?{color:'var(--gold-bright)'}:{}}><Icon d={it.icon} s={19}/></span>
              {t[it.k]}
            </button>
          );
        })}
      </nav>
      <div className="p-3 border-t border-white/10 space-y-1">
        {deferred && !installed && (
          <button onClick={install}
            className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-[13px] font-semibold text-white hover:brightness-105 transition"
            style={{background:'linear-gradient(135deg,#A5760A,#C99A2E)'}}>
            <Icon d={I.download} s={17}/>{t.install_app}
          </button>
        )}
        {installed && (
          <div className="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-[12px] font-semibold text-white/60">
            <Icon d={I.check} s={16}/>{t.offline_ready}

        )}
        <button onClick={()=>setLang(lang==='vi'?'en':'vi')}
          className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-[13px] font-medium text-white/70 hover:text-white hover:bg-white/5 transition">
          <span className="flex items-center gap-2.5"><Icon d={I.globe} s={17}/>{t.langFull}</span>
          <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-white/10">{t.lang}</span>
        </button>
      </div>
    </aside>
  );
}

function SectionInfo({report, up, db, persist}){
  const t = useT();
  const info = report.info;
  const lib = db.equipmentLib || [];
  const setInfo = (k,v)=> up({info:{...info,[k]:v}});
  const setEq = (id,k,v)=> up({equipment: report.equipment.map(e=>e.id===id?{...e,[k]:v}:e)});
  const addEq = ()=> up({equipment:[...report.equipment,{id:uid(),name:"",mfr:"",model:"",serial:"",tag:"",part:"",app:"",loc:"",checklist:'generic'}]});
  const delEq = (id)=> up({equipment: report.equipment.filter(e=>e.id!==id)});
  const pickCustomer = (c)=> up({info:{...info,customer:c.company,contact:c.contact,position:c.position,phone:c.phone,email:c.email}});

  const applyLib = (id, l)=>{
    up({equipment: report.equipment.map(e=> e.id===id ? {...e, name:l.name, mfr:l.mfr, model:l.model, checklist:l.checklist, libId:l.id} : e)});
  };
  // is this report-equipment already saved in the library? (match by model+mfr+name)
  const inLib = (e)=> lib.some(l=> (l.model||"")===(e.model||"") && (l.mfr||"")===(e.mfr||"") && (l.name||"")===(e.name||""));
  const saveToLib = (e)=>{
    if(!persist) return;
    const entry = { id:uid(), name:(e.name||e.model||"").trim(), mfr:e.mfr||"", model:e.model||"", cat:e.app||"", checklist:e.checklist||'generic', customChecklist:null };
    if(!entry.name && !entry.model) return;
    persist({...db, equipmentLib:[entry, ...lib]});
  };

  return (
    <div className="space-y-5">
      <SecHead no="01" title={t.sec_info}/>
      <Card>
        <div className="grid grid-cols-2 gap-4">
          <Field label={t.f_reportNo} value={info.reportNo} onChange={v=>setInfo('reportNo',v)} mono/>
          <Field label={t.f_date} type="date" value={info.date} onChange={v=>setInfo('date',v)}/>
          <label className="flex flex-col gap-1.5 col-span-2">
            <span className="text-[12px] font-semibold text-[var(--ink-3)] uppercase tracking-wide">{t.serviceType}</span>
            <select value={report.serviceType} onChange={e=>up({serviceType:e.target.value})}
              className="w-full px-3 py-2.5 rounded-lg border border-[var(--line)] bg-white text-[14px]">
              {SERVICE_TYPES.map(s=><option key={s.id} value={s.id}>{t[s.k]}</option>)}

/* ---- Section: Work + Checklist ---- */
function SectionWork({report, up, db}){
  const t = useT();

  const addW = ()=> up({work:[...work,{id:uid(),title:"",desc:"",status:'done',result:""}]});
  const delW = (id)=> up({work: work.filter(w=>w.id!==id)});
  const loadSample = ()=>{
    const sample = ["Visual Inspection","Power Supply Check","Sensor Inspection","Signal Verification","Measurement Test","Communication Test"];
    up({work:[...work, ...sample.map(s=>({id:uid(),title:s,desc:"",status:'done',result:""}))]});
  };

  // checklist based on first equipment; prefer the library item's custom checklist if linked
  const eq0 = report.equipment[0];
  const eqCl = eq0?.checklist || 'generic';
  const libItem = (db?.equipmentLib||[]).find(l=> l.id===eq0?.libId || ((l.model||"")===(eq0?.model||"") && (l.mfr||"")===(eq0?.mfr||"") && (eq0?.model||eq0?.mfr)));
  const groups = libItem ? equipGroups(libItem) : (CHECKLISTS[eqCl] || CHECKLISTS.generic).groups;
  const clName = libItem ? (eq0?.name || eq0?.model || (CHECKLISTS[eqCl]||CHECKLISTS.generic).name) : (CHECKLISTS[eqCl] || CHECKLISTS.generic).name;
  const cl = {name:clName, groups};
  const clKeyBase = libItem ? ('lib-'+libItem.id) : eqCl;
  const clState = report.checklistState || {};
  const toggle = (key)=> up({checklistState:{...clState,[key]:!clState[key]}});

  const WS = {done:{k:'ws_done',c:'#0E7C66'},pending:{k:'ws_pending',c:'#C2790B'},na:{k:'ws_na',c:'#8A94A3'}};

/* ---- Section: Photos ---- */
function SectionPhotos({report, up}){
  const t = useT();
  const photos = report.photos;
  const fileRef = useRef();
  const [drag, setDrag] = useState(false);
  const [annotating, setAnnotating] = useState(null);
  const saveAnn = (p)=> up({photos: photos.map(x=>x.id===p.id?p:x)});

  const addFiles = (files)=>{
    Array.from(files).forEach(file=>{
      if(!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e=> up(r=>({photos:[...r.photos,{id:uid(),src:e.target.result,caption:""}]}));
      reader.readAsDataURL(file);
    });
  };
  const onDrop = (e)=>{ e.preventDefault(); setDrag(false); if(e.dataTransfer.files) addFiles(e.dataTransfer.files); };
  const setCap = (id,v)=> up({photos: photos.map(p=>p.id===id?{...p,caption:v}:p)});
  const del = (id)=> up({photos: photos.filter(p=>p.id!==id)});
  const move = (id,dir)=>{
    const i = photos.findIndex(p=>p.id===id); const j=i+dir;
    if(j<0||j>=photos.length) return;
    const arr=[...photos]; [arr[i],arr[j]]=[arr[j],arr[i]]; up({photos:arr});
  };

  // paste support
  useEffect(()=>{
    const h = (e)=>{ if(e.clipboardData){ const items=[...e.clipboardData.items].filter(x=>x.type.startsWith('image/')); if(items.length){ addFiles(items.map(x=>x.getAsFile())); } } };
    window.addEventListener('paste',h); return ()=>window.removeEventListener('paste',h);
  },[photos]);

  return (
    <div className="space-y-5">
      <SecHead no="05" title={t.sec_photos}/>
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop}
        onClick={()=>fileRef.current.click()}
        className={"border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition bg-white "+(drag?"drag-over":"border-[var(--line-strong)] hover:border-[var(--accent)] hover:bg-[var(--paper)]")}>
        <div className="w-12 h-12 rounded-xl bg-[var(--ice)] text-[var(--navy)] flex items-center justify-center mx-auto mb-3"><Icon d={I.image} s={24}/></div>
        <div className="text-[14px] font-semibold text-[var(--ink-2)]">{t.dropHint}</div>

/* ---- Section: Signatures + Revisions ---- */
function SectionSignoff({report, up, update, settings}){
  const t = useT();
  const [signing, setSigning] = useState(null); // key
  const sigs = report.signatures;
  const roles = [['prepared','sig_prepared'],['checked','sig_checked'],['approved','sig_approved']];
  const setSig = (key,val)=> up({signatures:{...sigs,[key]:val}});

  const revs = report.revisions || [];
  const [desc, setDesc] = useState("");
  const [by, setBy] = useState("");
  const newRev = ()=>{
    const rev = revs.length;
    const entry = {rev, date:todayISO(), by:by||report.info.engineer||"—", desc:desc||"—"};
    up({revisions:[...revs, entry]}); setDesc(""); setBy("");
  };

  const qrText = `${report.info.reportNo} | ${report.info.customer||""} | ${settings.company}`;
  const qrUrl = useQR(qrText, 140);

  return (
    <div className="space-y-5">
      <SecHead no="06" title={t.signatures}/>

      {/* signatures */}
      <Card>
        <div className="grid md:grid-cols-3 gap-4">
          {roles.map(([key,label])=>{
            const s = sigs[key];
            return (
              <div key={key} className="border border-[var(--line)] rounded-lg p-4 text-center">
                <div className="text-[12px] font-bold text-[var(--ink-3)] uppercase tracking-wide mb-3">{t[label]}</div>
                <div className="h-20 flex items-center justify-center border-b border-[var(--line)] mb-2 bg-[var(--paper)] rounded">
                  {s.img ? <img src={s.img} className="max-h-16 object-contain"/> : <span className="text-[12px] text-[var(--ink-3)]">—</span>}
                </div>
                <div className="text-[13.5px] font-bold text-[var(--ink)]">{s.name||"—"}</div>
                <div className="text-[12px] text-[var(--ink-3)] mb-3">{s.pos||""}</div>
                <Btn variant="outline" size="sm" onClick={()=>setSigning(key)} className="w-full"><Icon d={I.edit} s={15}/>{t.sig_edit}</Btn>
              </div>
            );
          })}
        </div>
      </Card>

      {/* QR */}
      <Card>
        <div className="flex items-center gap-4">
          <div className="w-[110px] h-[110px] rounded-lg border border-[var(--line)] bg-white flex items-center justify-center shrink-0">
            {qrUrl ? <img src={qrUrl} className="w-24 h-24"/> : <span className="text-[11px] text-[var(--ink-3)]">QR…</span>}
          </div>
          <div>
            <div className="text-[14px] font-bold mb-1">{t.qr_show}</div>
            <div className="text-[13px] text-[var(--ink-3)] leading-relaxed">{t.qr_hint}</div>
            <div className="text-[12px] mono text-[var(--navy)] mt-1.5">{report.info.reportNo}</div>
          </div>
        </div>
      </Card>

      {/* revisions */}
      <Card>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-[14px] font-bold">{t.rev_history}</h3>
        </div>
        <div className="space-y-2 mb-4">
          {revs.length===0 && <div className="text-[13px] text-[var(--ink-3)]">{t.rev_none}</div>}
          {revs.map((r,i)=>(
            <div key={i} className="flex items-center gap-3 p-2.5 rounded-lg bg-[var(--paper)] border border-[var(--line)]">
              <span className="mono text-[12px] font-bold text-white bg-[var(--navy)] px-2 py-1 rounded shrink-0">REV {String(r.rev).padStart(2,'0')}</span>
              <div className="flex-1 min-w-0">
                <div className="text-[13.5px] font-semibold text-[var(--ink)] truncate">{r.desc}</div>
                <div className="text-[12px] text-[var(--ink-3)] mono">{fmtDate(r.date)} · {r.by}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="border-t border-[var(--line)] pt-4 grid grid-cols-2 gap-3">
          <Field label={t.rev_desc} value={desc} onChange={setDesc} full/>
          <Field label={t.rev_by} value={by} onChange={setBy}/>
          <div className="flex items-end">
            <Btn variant="primary" size="sm" onClick={newRev} disabled={!desc.trim()}><Icon d={I.plus} s={15} sw={2}/>{t.rev_new}</Btn>
          </div>
        </div>
      </Card>

      {signing && <SignatureModal sig={sigs[signing]} roleLabel={t[roles.find(r=>r[0]===signing)[1]]}
        onSave={(v)=>{setSig(signing,v);setSigning(null);}} onClose={()=>setSigning(null)}/>}
    </div>
  );
}

/* ---- Equipment add/edit modal with checklist editor ---- */
function EquipmentModal({equip, onSave, onClose}){
  const t = useT();
  const [e, setE] = useState(()=>({...equip, customChecklist: equip.customChecklist ? JSON.parse(JSON.stringify(equip.customChecklist)) : null}));
  const s = (k,v)=>setE({...e,[k]:v});
  const useCustom = Array.isArray(e.customChecklist);

  // When switching to custom, seed from the sample of current type so user has a starting point
  const enableCustom = ()=> setE({...e, customChecklist: JSON.parse(JSON.stringify(equipGroups(e)))});
  const disableCustom = ()=> setE({...e, customChecklist:null});

  const groups = e.customChecklist || [];
  const setGroups = (g)=> setE({...e, customChecklist:g});
  const addGroup = ()=> setGroups([...groups, {title:"", items:[]}]);
  const setGroupTitle = (gi,v)=> setGroups(groups.map((g,i)=>i===gi?{...g,title:v}:g));
  const delGroup = (gi)=> setGroups(groups.filter((_,i)=>i!==gi));
  const addItem = (gi)=> setGroups(groups.map((g,i)=>i===gi?{...g,items:[...g.items,""]}:g));
  const setItem = (gi,ii,v)=> setGroups(groups.map((g,i)=>i===gi?{...g,items:g.items.map((it,j)=>j===ii?v:it)}:g));
  const delItem = (gi,ii)=> setGroups(groups.map((g,i)=>i===gi?{...g,items:g.items.filter((_,j)=>j!==ii)}:g));

  const canSave = (e.name||"").trim() || (e.model||"").trim();
  const doSave = ()=>{
    // clean empty custom items/groups
    let clean = e.customChecklist;
    if(Array.isArray(clean)){
      clean = clean.map(g=>({title:(g.title||"").trim(), items:g.items.map(x=>(x||"").trim()).filter(Boolean)}))
                   .filter(g=>g.title || g.items.length);
    }
    onSave({...e, name:(e.name||"").trim()||e.model, customChecklist: (Array.isArray(clean)&&clean.length)?clean:(useCustom?[]:null)});
  };

  return (
    <div className="fixed inset-0 bg-black/45 flex items-center justify-center z-[60] p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl w-full max-w-2xl card-shadow-lg fade-in max-h-[92vh] flex flex-col" onClick={ev=>ev.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-[var(--line)]">
          <h3 className="app-title font-bold text-[17px]">{equip.id ? t.editEquip : t.addEquipLib}</h3>
          <button onClick={onClose} className="p-1.5 rounded-md hover:bg-[var(--ice)]"><Icon d={I.x} s={18}/></button>
        </div>

        <div className="p-6 overflow-y-auto space-y-5">
          <div className="grid grid-cols-2 gap-4">
            <Field label={t.eq_name} value={e.name} onChange={v=>s('name',v)} full/>
            <Field label={t.eq_mfr} value={e.mfr} onChange={v=>s('mfr',v)}/>
            <Field label={t.eq_model} value={e.model} onChange={v=>s('model',v)} mono/>
            <Field label={t.eq_category} value={e.cat} onChange={v=>s('cat',v)}/>
            <label className="flex flex-col gap-1.5">
              <span className="text-[12px] font-semibold text-[var(--ink-3)] uppercase tracking-wide">{t.eq_checklist_type}</span>
              <select value={e.checklist} onChange={ev=>s('checklist',ev.target.value)} disabled={useCustom}
                className="w-full px-3 py-2.5 rounded-lg border border-[var(--line)] bg-white text-[14px] disabled:opacity-50">
                {CHECKLIST_TYPES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </label>
          </div>

          {/* checklist section */}
          <div className="border-t border-[var(--line)] pt-4">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[13px] font-bold text-[var(--ink)]">{t.checklist}</span>
              {useCustom
                ? <button onClick={disableCustom} className="text-[12.5px] font-semibold text-[var(--ink-3)] hover:text-[var(--ink)]">{t.cl_useSample}</button>
                : <Btn variant="outline" size="sm" onClick={enableCustom}><Icon d={I.edit} s={14}/>{t.cl_custom}</Btn>}
            </div>

            {!useCustom && (
              <div className="rounded-lg border border-[var(--line)] bg-[var(--paper)] p-3">
                {equipGroups(e).map((g,i)=>(
                  <div key={i} className="mb-2 last:mb-0">
                    <div className="text-[12px] font-bold text-[var(--gold-3)] uppercase tracking-wide">{g.title}</div>
                    <div className="text-[12.5px] text-[var(--ink-2)]">{g.items.join(" · ")}</div>
                  </div>
                ))}
              </div>
            )}

            {useCustom && (
              <div className="space-y-3">
                {groups.length===0 && <div className="text-[13px] text-[var(--ink-3)] text-center py-4 border border-dashed border-[var(--line)] rounded-lg">{t.cl_empty}</div>}
                {groups.map((g,gi)=>(
                  <div key={gi} className="border border-[var(--line)] rounded-lg p-3 bg-[var(--paper)]">
                    <div className="flex items-center gap-2 mb-2">
                      <input value={g.title} onChange={ev=>setGroupTitle(gi,ev.target.value)} placeholder={t.cl_groupName}
                        className="flex-1 px-3 py-2 rounded-lg border border-[var(--line)] text-[13.5px] font-semibold bg-white focus:border-[var(--gold)]"/>
                      <button onClick={()=>delGroup(gi)} className="p-2 rounded-md text-[var(--ink-3)] hover:text-[var(--red)] hover:bg-[var(--red-soft)]"><Icon d={I.trash} s={15}/></button>
                    </div>
                    <div className="space-y-1.5 pl-1">
                      {g.items.map((it,ii)=>(
                        <div key={ii} className="flex items-center gap-2">
                          <span className="w-1.5 h-1.5 rounded-full bg-[var(--line-strong)] shrink-0"></span>
                          <input value={it} onChange={ev=>setItem(gi,ii,ev.target.value)} placeholder={t.cl_itemName}
                            className="flex-1 px-2.5 py-1.5 rounded-md border border-[var(--line)] text-[13px] bg-white focus:border-[var(--gold)]"/>
                          <button onClick={()=>delItem(gi,ii)} className="p-1 rounded text-[var(--ink-3)] hover:text-[var(--red)]"><Icon d={I.x} s={14}/></button>
                        </div>
                      ))}
                      <button onClick={()=>addItem(gi)} className="text-[12.5px] font-semibold text-[var(--gold-3)] hover:underline flex items-center gap-1 pl-3.5 pt-1"><Icon d={I.plus} s={13} sw={2.5}/>{t.cl_addItem}</button>
                    </div>
                  </div>
                ))}
                <Btn variant="outline" size="sm" onClick={addGroup}><Icon d={I.plus} s={15} sw={2}/>{t.cl_addGroup}</Btn>
              </div>
            )}
          </div>
        </div>

        <div className="flex justify-end gap-2 px-6 py-4 border-t border-[var(--line)]">
          <Btn variant="ghost" onClick={onClose}>{t.cancel}</Btn>
          <Btn variant="primary" onClick={doSave} disabled={!canSave}><Icon d={I.check} s={16}/>{t.save}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   PREVIEW + PDF
   ============================================================ */
function PreviewScreen({report, settings, lang, onBack, update}){
  const t = useT();
  const [gen, setGen] = useState(false);
  const paperRef = useRef();
  const pdfLang = report.pdfLang || 'vi';
  const setPdfLang = (v)=> update && update({pdfLang:v});

  // Number the footers: count pages that actually have a footer (cover has none)
  useEffect(()=>{
    if(!paperRef.current) return;
    const id = setTimeout(()=>{
      const pages = [...paperRef.current.querySelectorAll('.pdf-page')];
      const withFooter = pages.filter(p=>p.querySelector('.pdf-pageno'));
      const total = withFooter.length;
      withFooter.forEach((p,i)=>{
        const el = p.querySelector('.pdf-pageno');
        if(el) el.textContent = `${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
      });
    }, 120);
    return ()=>clearTimeout(id);
  });
  const noDiacritics = (s)=> (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');
  const exportPDF = async ()=>{
    setGen(true);
    await new Promise(r=>setTimeout(r,80));
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation:'p',unit:'mm',format:'a4',compress:true});
      const pages = paperRef.current.querySelectorAll('.pdf-page');
      for(let i=0;i<pages.length;i++){
        const canvas = await html2canvas(pages[i], {scale:2.5, useCORS:true, backgroundColor:'#ffffff', logging:false, imageTimeout:0});
        const img = canvas.toDataURL('image/jpeg',0.94);
        if(i>0) pdf.addPage();
        pdf.addImage(img,'JPEG',0,0,210,297,undefined,'SLOW');
      }
      const clean = (s)=> noDiacritics(s).replace(/[^\w]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
      const fn = `${report.info.reportNo}_${clean(report.info.customer||'Report')}_${clean(report.equipment[0]?.model||'')}.pdf`.replace(/_+/g,'_').replace(/_\./,'.');
      pdf.save(fn);
    } catch(err){ alert('PDF error: '+err.message); }
    setGen(false);
  };

  return (
    <div className="flex flex-col h-full bg-[#4A5568]">
      <div className="flex items-center justify-between px-6 py-3.5 bg-white border-b border-[var(--line)] no-print">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="p-2 rounded-lg hover:bg-[var(--ice)] text-[var(--ink-2)]"><Icon d={I.chevL} s={18}/></button>
          <div>
            <div className="font-bold text-[15px]">{t.previewTitle}</div>
            <div className="text-[12px] text-[var(--ink-3)] mono">{report.info.reportNo}</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center gap-1 mr-1 text-[var(--ink-3)]"><Icon d={I.layers} s={16}/><span className="text-[12px] font-semibold hidden md:inline">{t.bilingual}</span></div>
          <div className="flex bg-[var(--paper)] rounded-lg p-0.5 border border-[var(--line)]">
            {[['vi',t.bi_vi],['en',t.bi_en],['both',t.bi_both]].map(([v,label])=>(
              <button key={v} onClick={()=>setPdfLang(v)}
                className={"text-[12.5px] font-semibold px-3 py-1.5 rounded-md transition "+(pdfLang===v?"bg-[var(--navy)] text-white":"text-[var(--ink-2)] hover:bg-white")}>{label}</button>
            ))}
          </div>
          <Btn variant="gold" onClick={exportPDF} disabled={gen}>
            {gen ? <><span className="w-4 h-4 border-2 border-white/40 border-t-white rounded-full spin"></span>{t.genPdf}</> : <><Icon d={I.download} s={17}/>{t.downloadPdf}</>}
          </Btn>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto py-8 px-4">
        <div ref={paperRef} className="mx-auto" style={{width:'210mm'}}>
          <ReportDocument report={report} settings={settings} lang={lang} pdfLang={pdfLang}/>
        </div>
      </div>
    </div>
  );
}

/* ---- The actual A4 document (redesigned: Gold & Green, serif, watermark, gallery) ---- */
function ReportDocument({report, settings, lang, pdfLang='vi'}){
  const primary = pdfLang==='en' ? 'en' : 'vi';
  const both = pdfLang==='both';
  const t = DICT[primary];
  const L = (key)=> both ? `${DICT.vi[key]} / ${DICT.en[key]}` : DICT[primary][key];
  const svcLabelIn = (id,lg)=>{ const s=SERVICE_TYPES.find(x=>x.id===id); return s?DICT[lg][s.k]:id; };
  const svcLabel = (id)=> both ? `${svcLabelIn(id,'vi')} / ${svcLabelIn(id,'en')}` : svcLabelIn(id, primary);
  const A = ASSESS[report.results.assess] || ASSESS.normal;
  const assessLabel = both ? `${DICT.vi[A.k]} / ${DICT.en[A.k]}` : t[A.k];
  const priColor = {low:'#0B7A47',med:'#B8860B',high:'#B23A2E'};
  const priLabel = {low:L('pri_low'),med:L('pri_med'),high:L('pri_high')};
  const SEVc = {low:'#0B7A47',med:'#B8860B',high:'#B23A2E'};
  const sevLabel = (s)=> both ? `${DICT.vi[s==='low'?'sev_low':s==='med'?'sev_med':'sev_high']} / ${DICT.en[s==='low'?'sev_low':s==='med'?'sev_med':'sev_high']}` : (s==='low'?t.sev_low:s==='med'?t.sev_med:t.sev_high);
  const condLabel = {excellent:L('cond_excellent'),good:L('cond_good'),fair:L('cond_fair'),poor:L('cond_poor'),critical:L('cond_critical')};
  const qrUrl = useQR(`${report.info.reportNo} | ${report.info.customer||""} | ${settings.company}`, 160);
  const lastRev = (report.revisions||[]).slice(-1)[0];
  const logo = settings.logo || LOGO_MARK;

  /* ---- Brand tokens for PDF ---- */
  const INK='#1E2A22', SUB='#5B6157', MUT='#8A8F82', LINE='#E6E3D8', LINE2='#D3CFBE';
  const GOLD='#B8860B', GOLDD='#A5760A', GOLDL='#EAD9A8', GOLDSOFT='#FBF3DF';
  const GREEN='#0B7A47', GREEND='#095C36', GREENSOFT='#E3F3EA', DARK='#1A2E24';
  const SERIF="'Noto Serif',Georgia,serif";
  const SANS="'Noto Sans',Arial,sans-serif";
  const MONO="'JetBrains Mono',monospace";

  /* rich value -> safe html (handles legacy plain-text values with newlines) */
  const rh = (v)=> isHtml(v) ? v : textToHtml(v);
  const RichOut = ({v, style, className})=> (v && htmlToText(v).trim())
    ? <div className={className||'prose-report'} style={style} dangerouslySetInnerHTML={{__html: rh(v)}}/> : null;
  const RichInline = ({v, style})=> <span style={style} dangerouslySetInnerHTML={{__html: rh(v)}}/>;

  /* ---- Watermark (very light, centered) ---- */
  const Watermark = () => (
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none',zIndex:0}}>
      <img src={logo} style={{width:'120mm',opacity:0.04,filter:'grayscale(30%)'}}/>

  );

  const Page = ({children, cover}) => (
    <div className="pdf-page bg-white mb-6 card-shadow-lg relative" style={{width:'210mm',height:'297mm',boxSizing:'border-box',fontFamily:SANS,overflow:'hidden',position:'relative'}}>

  const Header = () => (

  );

  /* Section heading: number chip (green) + serif title + gold underline */
  const H = ({no,children}) => (
    <div style={{marginBottom:'5mm'}}>

    <div style={{fontSize:'7.5pt',fontWeight:700,color:GREEND,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:'1.8mm',marginTop:'0'}}>{children}</div>

  const KV = ({k,v}) => (

  /* ---- Photo gallery: professional layout by count ---- */
  const figNoRef = {n:0};
  const Gallery = ({photos, startFig}) => {
    if(!photos || !photos.length) return null;
    const rows = [];
    const list = photos;
    const onlyOne = list.length===1;
    if(list.length===1){ rows.push([list[0]]); }
    else if(list.length===2){ rows.push([list[0],list[1]]); }
    else if(list.length===3){ rows.push([list[0]]); rows.push([list[1],list[2]]); }
    else {
      for(let k=0;k<list.length;k+=2){ rows.push(list.slice(k,k+2)); }
    }
    let fig = startFig;
    return (
      <div style={{marginTop:'2mm'}}>
        {rows.map((row,ri)=>(
          <div key={ri} style={{display:'flex',gap:'5mm',marginBottom:'4mm'}}>
            {row.map((p)=>{
              const cur = ++fig;
              // full-height only when the whole gallery is a single image; a lone trailing image stays half-width

              return (

                  </div>

            })}
          </div>
        ))}
      </div>
    );
  };
  // count fig offsets so numbering is continuous across sections
  const nOverview = (report.overview.photos||[]).length;
  const nWork = (report.workPhotos||[]).length;
  const nResults = (report.results.photos||[]).length;

  /* ---- Pagination: chunk photos so a gallery never overflows a page ---- */
  const chunkPhotos = (photos, firstMax, restMax) => {
    if(!photos || !photos.length) return [];
    const out=[]; let idx=0; let first=true;
    while(idx<photos.length){

      out.push(photos.slice(idx, idx+take)); idx+=take; first=false;

  /* Build dynamic content pages count for footer total (approx but correct ordering) */
  // Fixed pages: cover(not numbered) + info + overview + work + results + conclusion-area is within results page

            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'8.5pt'}}>
              <thead><tr style={{background:GREENSOFT}}>
                {[L('eq_name'),L('eq_mfr'),L('eq_model'),L('eq_serial'),L('eq_tag')].map((h,i)=>(
                  <th key={i} style={{textAlign:'left',padding:'2.4mm 3mm',fontSize:'7pt',color:GREEND,textTransform:'uppercase',fontWeight:700,border:`1px solid ${LINE2}`,letterSpacing:'.3px'}}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {report.equipment.map(e=>(
                  <tr key={e.id}>
                    <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,fontWeight:600,color:INK}}>{e.name}</td>
                    <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,color:SUB}}>{e.mfr}</td>
                    <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,fontFamily:MONO,color:INK}}>{e.model}</td>
                    <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,fontFamily:MONO,color:SUB}}>{e.serial}</td>
                    <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,fontFamily:MONO,color:SUB}}>{e.tag}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
      <Footer/>
    </Page>
  );

  // ---------- PAGE: Overview (text) + overview photos on same/overflow pages ----------
  pages.push(
    <Page key="overview">
      <Header/>
      <div style={{padding:'7mm 16mm'}}>
        <H no="02">{L('sec_overview')}</H>
        {htmlToText(report.overview.purpose).trim() && <>
          <SubH>{L('ov_purpose')}</SubH>
          <RichOut v={report.overview.purpose} style={{fontSize:'9.5pt',lineHeight:1.65,color:SUB,marginTop:0,marginBottom:'4mm'}}/>
        </>}
        {htmlToText(report.overview.condition).trim() && <>
          <SubH>{L('ov_condition')}</SubH>
          <div className="prose-report" style={{fontSize:'9.5pt',color:SUB,marginBottom:'4mm'}} dangerouslySetInnerHTML={{__html:rh(report.overview.condition)}}/>
        </>}
        {htmlToText(report.overview.env).trim() && <>
          <SubH>{L('ov_env')}</SubH>
          <RichOut v={report.overview.env} style={{fontSize:'9.5pt',lineHeight:1.6,color:SUB,marginBottom:'4mm',background:GREENSOFT,padding:'3mm 4mm',borderRadius:'6px',borderLeft:`3px solid ${GREEN}`}}/>
        </>}
        {nOverview>0 && <>
          <SubH>{L('photos_overview')}</SubH>
          <Gallery photos={(report.overview.photos||[]).slice(0,4)} startFig={0}/>
        </>}
      </div>
      <Footer/>
    </Page>
  );
  // overflow overview photos (>4)
  chunkPhotos((report.overview.photos||[]).slice(4), 6, 6).forEach((chunk,ci)=>{
    pages.push(
      <Page key={"ovph"+ci}>
        <Header/>
        <div style={{padding:'7mm 16mm'}}>
          <SubH>{L('photos_overview')} (tt)</SubH>
          <Gallery photos={chunk} startFig={4+ci*6}/>
        </div>
        <Footer/>
      </Page>
    );
  });

  // ---------- PAGE: Work + work photos ----------
  pages.push(
    <Page key="work">
      <Header/>
      <div style={{padding:'7mm 16mm'}}>
        <H no="03">{L('sec_work')}</H>
        <div>
          {report.work.map((w,i)=>{
            const wc = w.status==='done'?GREEN:w.status==='pending'?GOLD:MUT;
            return (
              <div key={w.id} style={{display:'flex',gap:'4mm',marginBottom:'3mm',paddingBottom:'3mm',borderBottom:i<report.work.length-1?`1px solid ${LINE}`:'none'}}>
                <div style={{fontFamily:MONO,fontSize:'8pt',fontWeight:700,color:'#fff',background:GREEN,minWidth:'6.5mm',height:'6.5mm',borderRadius:'4px',display:'flex',alignItems:'center',justifyContent:'center'}}>{String(i+1).padStart(2,'0')}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'1mm'}}>
                    <span style={{fontSize:'10pt',fontWeight:700,color:INK,fontFamily:SERIF}}>{w.title}</span>
                    <span style={{fontSize:'6.5pt',fontWeight:700,color:wc,border:`1px solid ${wc}`,borderRadius:'3px',padding:'0 4px'}}>{both?`${DICT.vi[w.status==='done'?'ws_done':w.status==='pending'?'ws_pending':'ws_na']} / ${DICT.en[w.status==='done'?'ws_done':w.status==='pending'?'ws_pending':'ws_na']}`:(w.status==='done'?t.ws_done:w.status==='pending'?t.ws_pending:t.ws_na)}</span>
                  </div>
                  {htmlToText(w.result).trim() && <RichOut v={w.result} style={{fontSize:'9pt',color:SUB,lineHeight:1.5}}/>}
                </div>
              </div>
            );
          })}
        </div>
        {nWork>0 && <div style={{marginTop:'3mm'}}>
          <SubH>{L('photos_work')}</SubH>
          <Gallery photos={(report.workPhotos||[]).slice(0,4)} startFig={nOverview}/>
        </div>}
      </div>
      <Footer/>
    </Page>
  );
  chunkPhotos((report.workPhotos||[]).slice(4), 6, 6).forEach((chunk,ci)=>{
    pages.push(
      <Page key={"wkph"+ci}>
        <Header/>
        <div style={{padding:'7mm 16mm'}}>
          <SubH>{L('photos_work')} (tt)</SubH>
          <Gallery photos={chunk} startFig={nOverview+4+ci*6}/>
        </div>
        <Footer/>
      </Page>
    );
  });

  // ---------- PAGE: Results + measurements + findings + recommendation ----------
  pages.push(
    <Page key="results">
      <Header/>
      <div style={{padding:'7mm 16mm'}}>
        <H no="04">{L('sec_results')}</H>
        <div style={{display:'inline-flex',alignItems:'center',gap:'8px',background:A.bg,padding:'2.2mm 5mm',borderRadius:'6px',marginBottom:'4mm'}}>
          <span style={{width:'10px',height:'10px',borderRadius:'50%',background:A.dot}}></span>
          <span style={{fontSize:'10pt',fontWeight:800,color:A.c}}>{assessLabel}</span>
        </div>
        {htmlToText(report.results.result).trim() && <RichOut v={report.results.result} style={{fontSize:'9.5pt',lineHeight:1.65,color:SUB,marginTop:0,marginBottom:'5mm'}}/>}

        {report.measurements.length>0 && <>
          <SubH>{L('measurements')}</SubH>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:'8.5pt',marginBottom:'5mm'}}>
            <thead><tr style={{background:DARK,color:'#fff'}}>
              {[L('m_param'),L('m_result'),L('m_unit'),L('m_status')].map((h,i)=>(
                <th key={i} style={{textAlign:i===1?'right':'left',padding:'2.4mm 3mm',fontSize:'7pt',textTransform:'uppercase',fontWeight:700,letterSpacing:'.3px'}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {report.measurements.map((m,i)=>{ const ma=ASSESS[m.status]||ASSESS.normal; return (
                <tr key={m.id} style={{background:i%2?GOLDSOFT:'#fff'}}>
                  <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,fontWeight:600,color:INK}}>{m.param}</td>
                  <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,textAlign:'right',fontFamily:MONO,fontWeight:700,color:INK}}>{m.result}</td>
                  <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`,color:SUB}}>{m.unit}</td>
                  <td style={{padding:'2.4mm 3mm',border:`1px solid ${LINE}`}}><span style={{color:ma.c,fontWeight:600}}>● {both?`${DICT.vi[ma.k]} / ${DICT.en[ma.k]}`:t[ma.k]}</span></td>
                </tr>
              );})}
            </tbody>
          </table>
        </>}

        {report.findings.length>0 && <>
          <SubH>{L('findings')}</SubH>
          {report.findings.map((f,i)=>(
            <div key={f.id} style={{border:`1px solid ${LINE2}`,borderRadius:'7px',padding:'3.2mm 4mm',marginBottom:'2.6mm',borderLeft:`3px solid ${SEVc[f.severity]}`,background:'#fff'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.2mm'}}>
                <span style={{fontFamily:MONO,fontSize:'7.5pt',fontWeight:700,color:GREEND}}>FINDING {String(i+1).padStart(2,'0')}</span>
                <span style={{fontSize:'7pt',fontWeight:700,color:SEVc[f.severity]}}>{sevLabel(f.severity)}</span>
              </div>
              <div style={{fontSize:'9.5pt',fontWeight:700,color:INK,marginBottom:'1mm',fontFamily:SERIF}}>{f.finding}</div>
              {htmlToText(f.obs).trim() && <div style={{fontSize:'8.5pt',color:SUB,lineHeight:1.5,marginBottom:'1mm'}}><b style={{color:MUT}}>{L('fi_obs')}:</b> <RichInline v={f.obs}/></div>}
              {htmlToText(f.rec).trim() && <div style={{fontSize:'8.5pt',color:SUB,lineHeight:1.5}}><b style={{color:MUT}}>{L('fi_rec')}:</b> <RichInline v={f.rec}/></div>}
            </div>
          ))}
        </>}

        {htmlToText(report.results.cause).trim() && <>
          <div style={{marginTop:'2mm'}}><SubH>{L('res_cause')}</SubH></div>
          <RichOut v={report.results.cause} style={{fontSize:'9.5pt',lineHeight:1.65,color:SUB,marginTop:0,marginBottom:'5mm'}}/>
        </>}

        {/* recommendation card */}
        <div style={{border:`1.5px solid ${DARK}`,borderRadius:'9px',overflow:'hidden',marginTop:'1mm'}}>
          <div style={{background:DARK,color:'#fff',padding:'2.6mm 5mm',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontFamily:SERIF,fontSize:'9.5pt',fontWeight:700,letterSpacing:'.4px'}}>{L('rec_title')}</span>
            <span style={{fontSize:'7.5pt',fontWeight:800,background:`linear-gradient(135deg,${GOLDD},${GOLD})`,color:'#fff',padding:'1mm 3.5mm',borderRadius:'20px'}}>{L('rec_priority')}: {priLabel[report.recommendation.priority].toUpperCase()}</span>
          </div>
          <div style={{padding:'3.5mm 5mm',fontSize:'9.5pt',lineHeight:1.6,color:INK,background:GOLDSOFT}}>
            {htmlToText(report.recommendation.action).trim() ? <RichInline v={report.recommendation.action}/> : '—'}
          </div>
        </div>
      </div>
      <Footer/>
    </Page>
  );

  // ---------- PAGE: Result photos + Conclusion ----------
  if(nResults>0 || htmlToText(report.conclusion).trim()){
    pages.push(
      <Page key="concl">
        <Header/>
        <div style={{padding:'7mm 16mm'}}>
          {htmlToText(report.conclusion).trim() && <>
            <H no="05">{L('sec_conclusion')}</H>
            <RichOut v={report.conclusion} style={{fontSize:'9.5pt',lineHeight:1.65,color:SUB,marginTop:0,marginBottom:'5mm'}}/>
          </>}
          {nResults>0 && <>
            <SubH>{L('photos_results')}</SubH>
            <Gallery photos={(report.results.photos||[]).slice(0,4)} startFig={nOverview+nWork}/>
          </>}
        </div>
        <Footer/>
      </Page>
    );
    chunkPhotos((report.results.photos||[]).slice(4), 6, 6).forEach((chunk,ci)=>{
      pages.push(
        <Page key={"rsph"+ci}>
          <Header/>
          <div style={{padding:'7mm 16mm'}}>
            <SubH>{L('photos_results')} (tt)</SubH>
            <Gallery photos={chunk} startFig={nOverview+nWork+4+ci*6}/>
          </div>
          <Footer/>
        </Page>
      );
    });
  }

  // ---------- PAGE: Site photos (from Photos section) ----------
  if(nSite>0){
    chunkPhotos(report.photos, 4, 6).forEach((chunk,ci)=>{
      pages.push(
        <Page key={"siteph"+ci}>
          <Header/>
          <div style={{padding:'7mm 16mm'}}>
            {ci===0 && <H no="06">{L('sec_photos')}</H>}
            <Gallery photos={chunk} startFig={nOverview+nWork+nResults+(ci===0?0:4+(ci-1)*6)}/>
          </div>
          <Footer/>
        </Page>
      );
    });
  }

  // ---------- END PAGE: signatures + QR ----------
  pages.push(
    <Page key="end">
      <div style={{height:'297mm',display:'flex',flexDirection:'column',justifyContent:'space-between',position:'relative'}}>
        <Header/>
        <div style={{textAlign:'center',padding:'0 20mm'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10mm',marginBottom:'26mm',textAlign:'center'}}>
            {[['sig_prepared','prepared'],['sig_checked','checked'],['sig_approved','approved']].map(([k,key])=>(
              <div key={key}>
                <div style={{fontSize:'7.5pt',fontWeight:700,color:GREEND,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'2mm'}}>{L(k)}</div>
                <div style={{height:'18mm',display:'flex',alignItems:'flex-end',justifyContent:'center',marginBottom:'1mm'}}>
                  {report.signatures[key].img ? <img src={report.signatures[key].img} style={{maxHeight:'18mm',maxWidth:'90%',objectFit:'contain'}}/> : null}
                </div>
                <div style={{borderTop:`1px solid ${LINE2}`,paddingTop:'2mm'}}>
                  <div style={{fontSize:'9.5pt',fontWeight:700,color:INK,fontFamily:SERIF}}>{report.signatures[key].name||'—'}</div>
                  <div style={{fontSize:'7.5pt',color:SUB}}>{report.signatures[key].pos||''}</div>
                </div>
              </div>
            ))}
          </div>
          <div style={{fontFamily:SERIF,fontSize:'15pt',fontWeight:700,color:INK,marginBottom:'2mm',marginTop:'6mm'}}>{both?`${DICT.vi.thankyou}`:t.thankyou}</div>
          <div style={{width:'34mm',height:'2.5px',background:`linear-gradient(90deg,${GOLDD},${GOLD})`,margin:'3mm auto'}}></div>
          {qrUrl && (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',marginTop:'5mm'}}>
              <div style={{padding:'2mm',border:`1px solid ${LINE2}`,borderRadius:'6px',background:'#fff'}}>
                <img src={qrUrl} style={{width:'24mm',height:'24mm',display:'block'}}/>
              </div>
              <div style={{fontSize:'7pt',color:MUT,marginTop:'2mm',fontFamily:MONO}}>{report.info.reportNo}{lastRev?` · REV ${String(lastRev.rev).padStart(2,'0')}`:''}</div>
            </div>
          )}
        </div>
        <div style={{background:`linear-gradient(135deg,${DARK},${GREEND})`,color:'#fff',padding:'7mm 16mm',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontFamily:SERIF,fontWeight:700,fontSize:'11pt'}}>{settings.company}</div>
            <div style={{fontSize:'7.5pt',opacity:.75,marginTop:'1mm',maxWidth:'110mm'}}>{settings.address}</div>
          </div>
          <div style={{textAlign:'right',fontSize:'7.5pt',opacity:.85}}>
            {settings.website && <div>{settings.website}</div>}
            {settings.email && <div>{settings.email}</div>}
            {settings.hotline && <div>{t.s_hotline}: {settings.hotline}</div>}
          </div>
        </div>
      </div>
    </Page>
  );

  return <div>{pages}</div>;
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
